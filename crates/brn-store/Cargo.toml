[package]
name = "brn-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
