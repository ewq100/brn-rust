[package]
name = "brn-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
quick-xml = "=0.41.0"
roxmltree = "=0.21.1"

[dev-dependencies]
tempfile = "3"
