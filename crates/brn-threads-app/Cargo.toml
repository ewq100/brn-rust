[package]
name = "brn-threads-app"
version = "0.1.0"
edition = "2024"
publish = false

[features]
native-retrieval = ["brn-retrieval/native"]

[dependencies]
brn-threads-core = { path = "../brn-threads-core" }
brn-threads-intake = { path = "../brn-threads-intake" }
brn-ai = { path = "../brn-ai" }
brn-retrieval = { path = "../brn-retrieval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "=1.26.1", features = ["v4"] }
thiserror = "2"
tempfile = "3"
libc = "0.2"

[dev-dependencies]
brn-ai = { path = "../brn-ai", features = ["scripted-runs"] }
rig = { version = "=0.45.0", default-features = false, features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
