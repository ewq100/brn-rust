[package]
name = "brn-retrieval"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native = ["dep:fastembed", "dep:reqwest", "dep:sha1", "dep:libc"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"], optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
sha1 = { version = "=0.10.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189", optional = true }

[dev-dependencies]
tempfile = "3"
