[package]
name = "brn-workflow"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-retrieval = ["brn-retrieval/native"]

[dependencies]
brn-ai = { path = "../brn-ai" }
brn-store = { path = "../brn-store" }
brn-retrieval = { path = "../brn-retrieval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
markdown = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileCoordinator", "NSFilePresenter", "NSOperation", "NSURL", "NSString", "NSError", "NSArray", "NSDictionary", "block2"] }
block2 = "=0.6.2"

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tempfile = "3"
