[package]
name = "brn-workflow"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-retrieval = ["brn-retrieval/native"]

[dependencies]
brn-store = { path = "../brn-store" }
brn-provider = { path = "../brn-provider" }
brn-retrieval = { path = "../brn-retrieval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
similar = "2.7"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "brn-flow"
path = "src/main.rs"
