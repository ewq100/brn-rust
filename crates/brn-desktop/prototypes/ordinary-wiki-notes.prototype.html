<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRN · notes design prototype</title>
<!-- Three synthetic note layouts in the Omakase shell. ?variant=A|B|C. Throwaway, no persistence or BRN connection. -->
<style>
:root{--paper:#f7f5ee;--tile:#fffdf7;--alt:#f1f5ed;--line:#9cad91;--ink:#283526;--muted:#56634f;--accent:#416438;--warn:#f8efdd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:1px solid var(--line);padding:7px 11px}button:hover,button.active{background:var(--alt);border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.mono,.chrome,.label{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.label{text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.muted{color:var(--muted)}.top{height:61px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:600;letter-spacing:.12em}.launcher{flex:1;max-width:480px;padding:9px 12px;background:var(--tile);border:1px solid var(--line)}.layouts{margin-left:auto;display:flex;gap:4px}.top button{font-size:12px}.notice{padding:9px 24px;color:var(--muted);font-size:12px;border-bottom:1px solid #d9dfd1}.workspace{padding:16px 18px 100px}.tile{background:var(--tile);border:1px solid var(--line);min-width:0}.tile-header{height:41px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.body{padding:25px 30px}h1{font-size:31px;line-height:1.15;letter-spacing:-.03em;font-weight:600;margin:12px 0 14px}h2{font-size:19px;margin:28px 0 9px;font-weight:600}h3{font-size:15px;margin:12px 0 6px}p{margin:10px 0 16px}.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.chip{font-size:11px;border:1px solid var(--line);padding:3px 7px}.protected{background:#edf0e6}.summary{font-size:19px;line-height:1.5}.warning{border-left:3px solid #815623;background:var(--warn);padding:13px 16px;margin:19px 0}.warning p{margin:6px 0 12px;font-size:14px}.facts{width:100%;border-collapse:collapse;font-size:14px}.facts td,.facts th{border-bottom:1px solid #dfe4d9;text-align:left;vertical-align:top;padding:10px 0}.facts th{font-weight:400;width:37%;color:var(--muted)}.citation{font-size:11px;padding:1px 5px;vertical-align:2px;margin-left:4px}.footer{border-top:1px solid var(--line);padding:11px 15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.footer button{font-size:12px}.reading{display:grid;grid-template-columns:210px minmax(430px,1fr) 285px;gap:12px;max-width:1520px;margin:auto}.nav{padding:15px 12px}.nav input{width:100%;padding:8px;background:var(--tile);border:1px solid var(--line);font-size:13px}.nav .label{margin:23px 9px 8px}.note-link{display:block;width:100%;text-align:left;padding:11px 9px;border:0;border-bottom:1px solid #e3e6dc;font-size:14px}.note-link small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.note-link.selected{background:var(--alt);border-left:2px solid var(--accent)}.context{padding:19px 18px}.context section{margin-bottom:27px}.source{border-top:1px solid #dce2d4;padding:12px 0;font-size:13px}.source button{padding:2px 0;border:0;font-size:14px;text-align:left}.source .muted{font-size:11px;margin-top:5px}.relation{font-size:13px;padding:8px 0;display:flex;gap:9px;align-items:center}.relation button{border:0;padding:0;font-size:14px;text-align:left}.badge{color:var(--accent);font-size:11px}.overview{max-width:1320px;margin:auto}.overview-heading{padding:26px 30px;border-bottom:1px solid var(--line)}.overview-heading h1{font-size:39px}.overview-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.overview-main>.body:first-child{border-right:1px solid var(--line)}.library-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.library-bar .muted{margin-left:auto}.drawer.library{left:50%;right:auto;transform:translateX(-50%);width:min(820px,calc(100vw - 24px));top:100px;max-height:calc(100vh - 150px)}.library-search{width:100%;padding:10px;border:1px solid var(--line);background:var(--tile);margin:14px 0}.library-result{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #dce2d4;padding:10px 5px}.library-result small{display:block;font-size:12px;color:var(--muted)}.library-count{margin:12px 0}.library-filters{display:flex;gap:7px;flex-wrap:wrap}.horizontal-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.timeline{margin:20px 0;border-left:1px solid var(--line);padding-left:19px}.timeline article{padding:0 0 17px;position:relative;font-size:14px}.timeline article:before{content:"";width:6px;height:6px;background:var(--accent);position:absolute;left:-23px;top:8px}.connections{display:grid;grid-template-columns:310px minmax(430px,1fr);gap:12px;max-width:1400px;margin:auto}.map{padding:18px}.map .label{margin:16px 0 6px}.node{padding:13px;border:1px solid var(--line);background:var(--tile);margin:8px 0;width:100%;text-align:left}.node small{display:block;color:var(--muted);font-size:11px}.node.current{background:var(--alt);border:2px solid var(--accent)}.edge{font-size:11px;margin-left:14px;color:var(--muted)}.split-read{display:grid;grid-template-columns:minmax(0,1fr) 230px}.evidence-margin{border-left:1px solid var(--line);padding:24px 16px;font-size:13px}.evidence-margin .label{margin-bottom:12px}.outline{padding:16px;border-top:1px solid var(--line)}.outline a{display:block;font-size:13px;text-decoration:none;color:var(--accent);padding:5px 0}.statusbar{position:fixed;bottom:0;left:0;right:0;height:32px;border-top:1px solid var(--line);background:var(--paper);padding:7px 18px;display:flex;justify-content:space-between}.switcher{position:fixed;bottom:47px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:5px;background:var(--ink);color:var(--tile);box-shadow:0 3px 14px #28352625;font:12px ui-monospace,SFMono-Regular,monospace;z-index:10}.switcher button{color:var(--tile);border-color:#64745b;padding:7px 11px}.switcher button:hover{background:var(--accent)}.switcher span{min-width:240px;text-align:center}.drawer{position:fixed;right:20px;top:112px;width:440px;max-height:calc(100vh - 170px);overflow:auto;z-index:20;background:var(--tile);border:1px solid var(--accent);box-shadow:0 10px 50px #28352630}.drawer .body{padding:22px 25px}.drawer h2{margin:0 0 15px}.excerpt{background:var(--alt);padding:15px;font-size:14px;white-space:pre-line}.drawer textarea{width:100%;padding:10px;background:var(--tile);border:1px solid var(--line);margin:8px 0;min-height:140px}.close{border:0;padding:0 4px}.history-row{padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.state{padding:13px 18px;margin-top:13px;border:1px dashed var(--line);font-size:11px;background:var(--paper);white-space:pre-wrap}.guard{padding:10px 16px;background:var(--warn);border-bottom:1px solid var(--line);font-size:12px}.hidden{display:none}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--ink);color:var(--tile);z-index:30;font-size:13px;max-width:650px}.quote{font-size:13px;border-left:2px solid var(--line);padding-left:12px}@media(max-width:1120px){.reading{grid-template-columns:190px minmax(400px,1fr)}.reading>.tile:last-child{grid-column:1/-1}.reading>.tile:last-child .context{display:grid;grid-template-columns:1fr 1fr;gap:25px}.split-read{grid-template-columns:1fr}.evidence-margin{border-left:0;border-top:1px solid var(--line)}}@media(max-width:760px){.top{padding:0 12px;gap:12px}.launcher{max-width:unset}.layouts{display:none}.workspace{padding:12px 10px 100px}.reading,.connections,.overview-main{display:block}.reading>.tile,.connections>.tile{margin-bottom:12px}.reading>.tile:last-child .context{display:block}.nav .label{display:none}.nav .note-link{display:inline-block;width:auto;max-width:100%;margin:5px 4px 0 0}.nav .note-link small{display:none}.nav{padding:10px}.body{padding:22px}.overview-main>.body:first-child{border-right:0;border-bottom:1px solid var(--line)}.overview-heading{padding:24px}.overview-heading h1{font-size:31px}.drawer{right:10px;left:10px;width:auto}.map .edge{display:none}.map .node{display:inline-block;width:auto;max-width:100%;padding:8px;margin:4px 2px}.map .node small{display:none}.map{padding:12px}.map .label{margin:0}.switcher span{min-width:200px}.statusbar span:last-child{display:none}h1{font-size:27px}}
</style></head><body>
<header class="top"><div class="brand">BRN</div><input class="launcher chrome" placeholder="Find a note or ask about your knowledge    ⌘K" aria-label="Find notes" onfocus="openLibrary('recent')" oninput="searchLibrary(this.value)"><div class="layouts chrome"><button onclick="toast('Existing layout controls; this prototype compares the note experience.')">write</button><button onclick="openDrawer('chat')">chat</button><button onclick="toast('Solo reading would keep the same note and evidence available.')">solo</button></div><button class="chrome" onclick="openDrawer('conflict')">1 needs you ↗</button></header>
<div class="notice mono">DESIGN PROTOTYPE · synthetic knowledge · compare three layouts · every control stays in this demo</div><main id="app" class="workspace"></main><div id="drawer" class="drawer hidden" role="dialog" aria-modal="false" aria-label="Note context"></div><div class="switcher"><button onclick="cycle(-1)" aria-label="Previous design">←</button><span id="variant-label"></span><button onclick="cycle(1)" aria-label="Next design">→</button></div><footer class="statusbar chrome"><span id="status"></span><span>sources and history stay reachable · synthetic state</span></footer>
<script>
const variants=['A','B','C'],names={A:'Read with context',B:'Subject overview',C:'Connected reading'};
let variant=new URLSearchParams(location.search).get('variant')||'B',state={note:'project',dirtyByNote:{},drafts:{},undo:false,drawer:null,source:null};if(!variants.includes(variant))variant='B';
const notes={project:{title:'Harbor · current delivery plan',purpose:'project account',protected:false,version:4,change:'13 October · BRN · source update'},requirements:{title:'Loading requirements',purpose:'process explanation',protected:false,version:2,change:'13 October · BRN · explanation saved'},commitment:{title:'Signed delivery reference',purpose:'imported reference',protected:true,version:1,change:'13 October · full reference imported'},comparison:{title:'Fixed-slot or tidal access?',purpose:'comparison',protected:false,version:1,change:'13 October · BRN · comparison saved'}};
const coreNoteIds=Object.keys(notes),topics=['Archive','Boats','Cargo','Delivery','Energy','Finance','Garden','Harbor','Intake','Jobs','Knowledge','Loading','Meetings','Navigation','Operations','Planning'];
const catalog=[...coreNoteIds.map(id=>({id,title:notes[id].title,searchText:id==='project'?'Delivery estimated 15 November; cargo 12 tonnes; Jaan coordinates loading':id==='requirements'?'Cargo maximum 12 tonnes; depth at least 1.2 metres':id==='comparison'?'Compare fixed slots and tidal access, wind and booking conditions':'Signed agreement reports 22 November'})),...Array.from({length:496},(_,i)=>({id:'demo-'+i,title:topics[i%16]+' · working note '+String(Math.floor(i/16)+1).padStart(2,'0'),searchText:'Synthetic navigation fixture about '+topics[i%16]+'. Reference '+i+'. No sourced claims.',fixture:true}))];
let navigation={mode:'recent',query:'',letter:'',page:0,recent:['project','comparison','requirements','commitment',...catalog.slice(-8).map(n=>n.id)]};
const sources={fixed:{title:'Fixed-slot access reference',date:'12 October 2026',availability:'Full process reference retained',quote:'Tuesday 09:00–11:00 local time. Reserve 48 hours beforehand. Depth at least 1.2 metres. Medical emergencies may request an exception. No cargo-mass limit is given.'},tidal:{title:'Tidal access reference',date:'12 October 2026',availability:'Full process reference retained',quote:'Tide height at least 2.4 metres. Reserve 24 hours beforehand. Cargo at most 12 tonnes. Closes at wind of 18 metres/second or stronger. Medical exception is unspecified.'},update:{title:'Mari’s shipment update',date:'12 October 2026',availability:'Retained passage · original not rechecked',quote:'Delivery is estimated for 15 November 2026; this is not a confirmed promise. Cargo may be up to 12 tonnes. Loading requires depth of at least 1.2 metres. Meeting confirmed for 10 November.'},agreement:{title:'Signed delivery agreement',date:'1 October 2026',availability:'Full reference retained · protected',quote:'The signed agreement reports a committed delivery date of 22 November 2026. A change requires agreement by the parties.'},older:{title:'Earlier planning note',date:'8 October 2026',availability:'Original unavailable in this demo · retained excerpt',quote:'Delivery estimated for 20 November 2026. Cargo cap 12 tonnes; loading depth at least 1.2 metres. Jaan coordinates loading.'}};
const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;
const head=title=>`<div class="tile-header chrome"><span>${title}</span><span>↗ &nbsp; ⋯</span></div>`;
function title(){let n=notes[state.note];return `<div class="chips"><span class="chip mono">${n.purpose}</span><span class="chip mono ${n.protected?'protected':''}">${n.protected?'protected':'working'} · v${state.undo&&state.note==='project'?5:n.version}</span><span class="muted mono">${dirty()?'unsaved draft':'saved'}</span></div><h1>${n.title}</h1><div class="muted mono">Last accepted change · ${state.undo&&state.note==='project'?'13 October · owner · Undo preview':n.change}</div>`}
function conflict(){return `<div class="warning"><div class="label">Unresolved discrepancy</div><p>The estimate is ${state.undo?'20':'15'} November. The signed reference reports 22 November. The commitment has not been replaced.</p>${btn('Open the decision thread ↗',"openDrawer('conflict')")}</div>`}
function content(){if(notes[state.note].demo)return `<p class="summary">${notes[state.note].title}</p><p>${catalog.find(n=>n.id===state.note).searchText}</p><p>This synthetic placeholder exercises navigation among 500 notes. It supplies no researched claims, retained sources or actual BRN history.</p>${btn('Return to Harbor overview',"selectNote('project')")}`;if(state.note==='commitment')return `<p class="summary">The signed agreement reports a committed delivery date of <strong>22 November 2026</strong>.</p><p>A change requires agreement by the parties. This imported reference is protected. Protection preserves its content; it does not certify its claims or record your adoption of them.</p><h2>Source</h2><p>Signed delivery agreement, 1 October 2026.</p>${btn('Read retained evidence',"openSource('agreement')")}`;if(state.note==='requirements')return `<p class="summary">Loading depends on both cargo mass and available water depth.</p><h2>Conditions</h2><p>The reported maximum cargo is <strong>12 tonnes</strong>. Loading requires depth of <strong>at least 1.2 metres</strong>. These are separate constraints; neither establishes that a proposed passage is possible.</p>${btn('Read source passage',"openSource('update')")}<h2>Related knowledge</h2>${btn('Harbor delivery plan →',"selectNote('project')")}`;if(state.note==='comparison')return `<p class="summary">Fixed slots offer a known clock window. Tidal access depends on water height and wind conditions.</p><h2>Supported differences</h2><p>Fixed slots: Tuesday 09:00–11:00, book 48 hours ahead, depth at least 1.2 metres. Medical emergencies can request an exception.</p><p>Tidal: height at least 2.4 metres, book 24 hours ahead, cargo at most 12 tonnes. Passage closes at wind of 18 metres/second or stronger.</p><h2>Interpretation</h2><p><strong>Inference:</strong> fixed slots may be easier to plan around, while tidal access may offer timing flexibility. The tidal source gives no medical-exception rule; it remains unspecified.</p><p class="muted mono">The context rail contains the two process references supporting this comparison.</p>`;return `<p class="summary">Delivery is <strong>estimated for ${state.undo?'20':'15'} November 2026</strong>. This is working planning evidence, not a replacement for the signed commitment.${state.undo?btn('3',"openSource('older')",'citation'):btn('1',"openSource('update')",'citation')}</p>${conflict()}<h2 id="constraints">Current constraints</h2><table class="facts"><tr><th>Cargo</th><td>Up to <strong>12 tonnes</strong> ${btn('1',"openSource('update')",'citation')}</td></tr><tr><th>Loading depth</th><td>At least <strong>1.2 metres</strong> ${btn('1',"openSource('update')",'citation')}</td></tr><tr><th>Meeting</th><td><strong>10 November 2026</strong>, confirmed in Mari’s message</td></tr><tr><th>Coordination</th><td>Jaan · reported in earlier planning ${btn('3',"openSource('older')",'citation')}</td></tr></table><h2 id="evidence">How the account changed</h2><p>The 12 October message updates the earlier estimate. The planning note written on 8 October was ingested later, but remains older evidence. Its contact detail is useful; its estimate does not become newer evidence.</p><h2 id="questions">Open question</h2><p>Clarify the estimate and signed commitment before making a new promise. No external reply has been sent.</p>`}
function nav(){return `<div class="tile">${head('NOTES')}<div class="nav"><input placeholder="Filter notes" aria-label="Filter notes" oninput="filterNotes(this.value)"><div class="label">Current subjects</div>${Object.entries(notes).map(([id,n])=>`<button data-note="${id}" class="note-link ${state.note===id?'selected':''}" onclick="selectNote('${id}')">${n.title}<small>${n.protected?'protected · imported':'working knowledge'}</small></button>`).join('')}<div class="label">Browse</div><p class="muted mono">Recent · linked work · A–Z</p></div></div>`}
function contextEntries(){if(notes[state.note].demo)return [];let ids=state.note==='comparison'?['fixed','tidal']:state.note==='commitment'?['agreement']:state.note==='requirements'?['update','older']:['update','agreement','older'];return ids.map(id=>[id,sources[id]])}
function sourceList(){return contextEntries().map(([id,s],i)=>`<div class="source"><button onclick="openSource('${id}')">${i+1}. ${s.title} ↗</button><div class="muted mono">${s.date}</div><div class="muted">${s.availability}</div></div>`).join('')}
function related(){if(notes[state.note].demo)return '<p class="muted">No recorded relationships in this navigation fixture.</p>';return `<div class="relation"><span class="badge mono">explains</span>${btn('Loading requirements →',"selectNote('requirements')")}</div><div class="relation"><span class="badge mono">reference</span>${btn('Signed delivery reference →',"selectNote('commitment')")}</div><div class="relation"><span class="badge mono">related</span>${btn('Fixed-slot or tidal access? →',"selectNote('comparison')")}</div>`}
function historyPreview(){if(notes[state.note].demo)return '<p class="muted">No actual BRN history in this navigation fixture.</p>';if(state.note!=='project')return `<div class="source"><strong>v${notes[state.note].version} · ${notes[state.note].protected?'Imported reference':'Saved knowledge'}</strong><p class="muted">${notes[state.note].change}</p>${btn('Inspect this note’s history →',"openDrawer('history')")}</div>`;return `<div class="source"><strong>${state.undo?'v5 · Undo preview':'v4 · Updated estimate'}</strong><p class="muted">${state.undo?'Earlier account restored as a new revision. Derived work may need reassessment.':'New planning evidence integrated; older contact retained.'}</p>${btn('Inspect exact changes →',"openDrawer('history')")}</div>`}
function foot(){return `<div class="footer"><span class="mono muted">${dirty()?'Unsaved writing · AI changes wait':notes[state.note].demo?'Synthetic fixture · no retained evidence':'Saved · evidence retained'}</span><div class="chips">${btn('Edit',"openDrawer('edit')")}${btn('Ask about this note',"openDrawer('chat')")}${btn('Changes',"openDrawer('history')")}</div></div>`}
const guard=()=>dirty()?'<div class="guard mono">Unsaved writing · dependent AI changes wait for Save or Discard. Your draft remains here.</div>':'';
function A(){return `<div class="reading">${nav()}<article class="tile">${head('NOTE · READING')}${guard()}<div class="body">${title()}${content()}</div>${foot()}</article><aside class="tile">${head('NOTE CONTEXT')}<div class="context"><section><div class="label">Evidence</div>${sourceList()}</section><section><div class="label">Related notes</div>${related()}<h3>What changed</h3>${state.note==='project'?historyPreview():'<p class="muted">Inspect this note’s accepted revisions in history.</p>'}</section></div></aside></div>`}
function B(){return `<div class="overview">${libraryBar()}<article class="tile">${head('SUBJECT OVERVIEW')}${guard()}<div class="overview-heading">${title()}<p class="muted">One subject account, with evidence and related work.</p></div><div class="overview-main"><div class="body">${content()}<h2>Connected work</h2>${related()}</div><div class="body"><div class="label">Evidence chronology</div><div class="timeline">${contextEntries().sort(([,a],[,b])=>a.date.localeCompare(b.date,undefined,{numeric:true})).map(([id])=>`<article><span class="mono muted">${sources[id].date}</span><h3>${sources[id].title}</h3><p>${sources[id].availability}</p>${btn('Inspect evidence →',`openSource('${id}')`)}</article>`).join('')}</div><div class="label">Change receipt</div>${historyPreview()}</div></div>${foot()}</article></div>`}
function C(){return `<div class="connections"><aside class="tile">${head('CONNECTIONS')}<div class="map"><div class="label">Incoming evidence</div>${contextEntries().map(([id,s])=>`<button class="node" onclick="openSource('${id}')">${s.title}<small>${s.date} · source</small></button><div class="edge mono">↓ supports reported account</div>`).join('')}<div class="node current">${notes[state.note].title}<small>${notes[state.note].protected?'protected reference':'working knowledge'} · selected subject</small></div><div class="label">Related knowledge</div>${Object.entries(notes).filter(([id])=>id!==state.note).map(([id,n])=>`<button class="node" onclick="selectNote('${id}')">${n.title}<small>${n.protected?'protected reference':'related working note'} →</small></button>`).join('')}</div>${state.note==='project'?'<div class="outline"><div class="label">In this note</div><a href="#constraints">Current constraints</a><a href="#evidence">How the account changed</a><a href="#questions">Open question</a></div>':''}</aside><article class="tile">${head('CONNECTED READING')}${guard()}<div class="split-read"><div class="body">${title()}${content()}</div><aside class="evidence-margin"><div class="label">Evidence close to the text</div><p class="quote">${contextEntries().length?contextEntries()[0][1].quote.slice(0,130)+'…':'No retained evidence in this synthetic navigation fixture.'}</p>${contextEntries().length?btn('Inspect passage →',`openSource('${contextEntries()[0][0]}')`):''}<h3>Evidence boundaries</h3><p>Source reports, AI interpretation and owner decisions remain distinguishable.</p>${state.note==='project'?btn('Open decision thread →',"openDrawer('conflict')"):''}<h3>Version history</h3>${state.note==='project'?historyPreview():'<p class="muted">History is scoped to the selected note.</p>'}</aside></div>${foot()}</article></div>`}
function render(){refreshDemoIndex();document.getElementById('app').innerHTML=({A,B,C}[variant])()+`<div class="state mono">DEMO STATE ${JSON.stringify({variant,note:state.note,protected:notes[state.note].protected,dirty:dirty(),undoPreview:state.undo,context:state.drawer,navigation:state.drawer==='library'?navigation:null})}\nPurpose labels and note-centered context are proposals. No BRN state is read or changed.</div>`;document.getElementById('variant-label').textContent=variant+' · '+names[variant];document.getElementById('status').textContent='idle · '+(dirty()?'unsaved draft':state.undo&&state.note==='project'?'Undo preview · v5':'saved note · v'+(state.undo&&state.note==='project'?5:notes[state.note].version))+' · Sammal'}
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render();window.scrollTo(0,0)}
function selectNote(id){if(!notes[id]){let n=catalog.find(n=>n.id===id);notes[id]={title:n.title,purpose:'navigation fixture',protected:false,version:1,change:'Synthetic fixture · no recorded BRN change',demo:true}}state.note=id;navigation.recent=[id,...navigation.recent.filter(n=>n!==id)].slice(0,12);closeDrawer();window.scrollTo(0,0)}
function filterNotes(text){document.querySelectorAll('[data-note]').forEach(el=>el.style.display=notes[el.dataset.note].title.toLowerCase().includes(text.toLowerCase())?'block':'none')}
function closeDrawer(){state.drawer=null;document.getElementById('drawer').classList.add('hidden');render()}
function openSource(id){state.source=id;openDrawer('source')}
function openDrawer(type){state.drawer=type;let body='';if(type==='library')body=libraryBody();if(type==='source'){let s=sources[state.source];body=`<div class="label">Evidence · supplied source</div><h2>${s.title}</h2><p class="mono muted">${s.date}<br>${s.availability}</p><div class="excerpt">${s.quote}</div><p class="muted">This is a retained passage. Attribution supplies evidence, rather than owner authority.</p>${state.source==='agreement'?btn('Read retained reference note',"selectNote('commitment')"):''}`}if(type==='conflict')body=`<div class="label">Thread · Needs you</div><h2>Clarify Harbor’s delivery date</h2><p>Mari reports an estimate of 15 November. The signed reference records 22 November. Both remain visible.</p><div class="excerpt">What should we communicate about the estimate and existing commitment?</div><textarea aria-label="Draft reply" placeholder="Discuss the decision here…"></textarea><p class="muted mono">Prototype composer · no message is sent</p>${btn('Preview decision review',"toast('A concrete proposed change would be reviewed here. This demo supplies no authority or commitment.')")}`;if(type==='history'&&state.note==='project')body=`<div class="label">Recorded changes</div><h2>Harbor note history</h2><div class="history-row"><strong>v4 · BRN integrated supplied evidence</strong><p>Reason: updated estimate, retained older contact and source qualifications.</p><div class="excerpt">Before: estimated 20 November<br>After: estimated 15 November; reference still 22 November.</div></div><p class="muted">Undo records a new compensating revision. Later changes can require reviewed compensation.</p><button onclick="previewUndo()" ${dirty()?'disabled':''}>Preview Undo of this update</button><p class="mono muted">${dirty()?'Save or discard the demo draft first.':'Synthetic operation · no external effects.'}</p>${btn('Reset demo',"resetDemo()")}`;if(type==='history'&&state.note!=='project')body=`<div class="label">Recorded changes</div><h2>${notes[state.note].title}</h2><p>v${notes[state.note].version} · ${notes[state.note].change}</p><p class="muted">This demo models Undo for the Harbor update only. A native history view must show this note’s actual receipts.</p>`;if(type==='chat')body=`<div class="label">Linked thread</div><h2>Ask about ${notes[state.note].title}</h2><p class="muted">The note and its evidence stay available beside the discussion.</p><textarea aria-label="Question" placeholder="Ask a question or delegate work…"></textarea>${btn('Preview answer context',"toast('This would retrieve current knowledge and available evidence. The prototype does not call a model.')")}`;if(type==='edit')body=`<div class="label">Your writing</div><h2>Edit this note</h2><p>Human writing stays coordinated with AI maintenance, including on protected notes.</p><textarea aria-label="Demo edit" oninput="setDirty(this.value)">${escapeText(state.drafts[state.note]||"Write a demo passage here…")}</textarea><div class="chips">${btn('Save demo draft',"finishDraft('saved')")}${btn('Discard demo draft',"finishDraft('discarded')")}</div><p class="mono muted">Simulated editor; draft text is not persisted.</p>`;let d=document.getElementById('drawer');d.innerHTML=`<div class="tile-header chrome"><span>CONTEXT</span><button class="close" onclick="closeDrawer()" aria-label="Close context">×</button></div><div class="body">${body}</div>`;d.classList.toggle('library',type==='library');d.classList.remove('hidden');render();if(type==='library')renderLibrary()}
function dirty(){return !!state.dirtyByNote[state.note]}
function escapeText(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function setDirty(value){state.dirtyByNote[state.note]=true;state.drafts[state.note]=value;render()}
function finishDraft(outcome){delete state.dirtyByNote[state.note];closeDrawer();toast('Demo draft '+outcome+'. A waiting change would recheck current versions.')}
function previewUndo(){state.undo=true;closeDrawer();toast('Undo preview: earlier account restored as v5; protected reference preserved. Derived work may need refresh.')}
function resetDemo(){state={note:'project',dirtyByNote:{},drafts:{},undo:false,drawer:null,source:null};closeDrawer()}
let timer;function toast(text){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);clearTimeout(timer);timer=setTimeout(()=>n.remove(),6000)}

function libraryBar(){return `<div class="library-bar">${btn('Browse 500 notes',"openLibrary('all')")}${btn('Recent',"openLibrary('recent')")}${btn('Linked to this note',"openLibrary('linked')")}<span class="muted mono">Search titles or text · ⌘K</span></div>`}
function libraryBody(){return `<div class="label">Notes library · 500 synthetic notes</div><h2>Find your next note</h2><div class="library-filters">${btn('Recent',"browseLibrary('recent')")}${btn('Linked to this note',"browseLibrary('linked')")}${btn('Protected & imported',"browseLibrary('protected')")}${btn('All A–Z',"browseLibrary('all')")}</div><input id="library-query" class="library-search" aria-label="Search 500 notes" placeholder="Search titles or note text…" value="${escapeText(navigation.query).replaceAll('"','&quot;')}" oninput="searchLibrary(this.value)" onkeydown="if(event.key==='Enter'){let n=libraryRows()[navigation.page*12];if(n)selectNote(n.id)}"><select aria-label="Starting letter" onchange="navigation.letter=this.value;navigation.page=0;renderLibrary()"><option value="">All starting letters</option>${[...new Set(catalog.map(n=>n.title[0]))].sort().map(l=>`<option ${navigation.letter===l?'selected':''}>${l}</option>`).join('')}</select><div id="library-results"></div><p class="muted mono">Demo search matches text. All notes and search results are synthetic; no AI is called.</p>`}

function refreshDemoIndex(){let current=state.note;for(let n of catalog){if(!n.fixture){state.note=n.id;n.bodyText=new DOMParser().parseFromString(content().replace(/<\/(p|h1|h2|h3|td|th|tr|div|table|button)>/g,' </$1>'),'text/html').body.textContent.replace(/\s+/g,' ').trim()}else n.bodyText=n.searchText+' This synthetic placeholder exercises navigation among 500 notes. It supplies no researched claims, retained sources or actual BRN history.'}state.note=current}
function resultSnippet(n){let q=navigation.query.trim().toLowerCase(),index=q?n.bodyText.toLowerCase().indexOf(q):-1,start=Math.max(0,index-45);return (start?'…':'')+n.bodyText.slice(start,start+160)+(start+160<n.bodyText.length?'…':'')}

function libraryRows(){let rows=catalog.slice();if(navigation.query.trim()){let q=navigation.query.trim().toLowerCase();rows=rows.filter(n=>(n.title+' '+n.bodyText).toLowerCase().includes(q))}else if(navigation.mode==='recent')rows=navigation.recent.map(id=>catalog.find(n=>n.id===id));else if(navigation.mode==='linked')rows=notes[state.note].demo?[]:coreNoteIds.filter(id=>id!==state.note).map(id=>catalog.find(n=>n.id===id));else if(navigation.mode==='protected')rows=rows.filter(n=>notes[n.id]?.protected);if(navigation.letter)rows=rows.filter(n=>n.title.startsWith(navigation.letter));if(navigation.mode!=='recent'||navigation.query.trim())rows.sort((a,b)=>a.title.localeCompare(b.title));return rows}
function renderLibrary(){let rows=libraryRows(),start=navigation.page*12,shown=rows.slice(start,start+12);document.getElementById('library-results').innerHTML=`<div class="library-count mono">${navigation.query.trim()?'Search':navigation.mode} · ${rows.length} ${rows.length===1?'match':'matches'} · ${rows.length?'showing '+(start+1)+'–'+(start+shown.length):'no matches'}</div>${shown.map(n=>`<button class="library-result" onclick="selectNote('${n.id}')">${n.title}<small>${escapeText(resultSnippet(n))}</small></button>`).join('')||'<p>No matching notes. Try another word or clear the search.</p>'}<div class="chips">${navigation.page?btn('Previous 12',"navigation.page--;renderLibrary()") :''}${start+12<rows.length?btn('Next 12',"navigation.page++;renderLibrary()") :''}</div>`;render()}
function openLibrary(mode){navigation.mode=mode;navigation.query='';navigation.letter='';navigation.page=0;openDrawer('library');document.getElementById('library-query').focus()}
function browseLibrary(mode){navigation.mode=mode;navigation.query='';navigation.letter='';navigation.page=0;openDrawer('library')}
function searchLibrary(value){navigation.query=value;navigation.page=0;if(state.drawer!=='library')openDrawer('library');else renderLibrary()}

addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openLibrary('recent');document.getElementById('library-query').focus();return}if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}if(e.key==='Escape')closeDrawer()});render();
</script></body></html>
