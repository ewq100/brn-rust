dding:10px}.body{padding:22px}.overview-main>.body:first-child{border-right:0;border-bottom:1px solid var(--line)}.overview-heading{padding:24px}.overview-heading h1{font-size:31px}.drawer{right:10px;left:10px;width:auto}.map .edge{display:none}.map .node{display:inline-block;width:auto;max-width:100%;padding:8px;margin:4px 2px}.map .node small{display:none}.map{padding:12px}.map .label{margin:0}.switcher span{min-width:200px}.statusbar span:last-child{display:none}h1{font-size:27px}}

9px;color:var(--muted)}.flow-shell+.state{margin-top:10px;max-height:60px;overflow:auto;font-size:10px}.theme-dark{--paper:#0f1419;--tile:#151b22;--alt:#1b232c;--line:#3c4958;--ink:#d6e2ea;--muted:#97a8bd;--accent:#5fd6a4;--warn:#302b21}.theme-dark .graph-node.protected rect{fill:#243327;stroke:#5e9472}.theme-dark .protected{background:#243327}.theme-dark .library-result,.theme-dark .topic-row,.theme-dark .graph-row{border-bottom-color:var(--line);border-top-color:var(--line)}

</style></head><body>
<header class="top"><div class="brand">BRN</div><input class="launcher chrome" placeholder="Find a note or ask about your knowledge    ⌘K" aria-label="Find notes" onfocus="openLibrary('recent')" oninput="searchLibrary(this.value)"><div class="layouts chrome"><button onclick="flowLayout('write')">write</button><button onclick="openDrawer('chat')">chat</button><button onclick="flowLayout('solo')">solo</button></div><button class="chrome" onclick="openDrawer('conflict')">1 needs you ↗</button></header>
<div class="notice mono">DESIGN PROTOTYPE · synthetic knowledge · compare three layouts · every control stays in this demo</div><main id="app" class="workspace"></main><div id="drawer" class="drawer hidden" role="dialog" aria-modal="false" aria-label="Note context"></div><div class="switcher"><button onclick="cycle(-1)" aria-label="Previous design">←</button><span id="variant-label"></span><button onclick="cycle(1)" aria-label="Next design">→</button></div><footer class="statusbar chrome"><span id="status"></span><button class="chrome" style="padding:0 6px;font-size:11px" onclick="toggleTheme()" aria-label="Change demo theme">theme</button><span>sources and history stay reachable · synthetic state</span></footer>
<script>
const variants=['A','B','C'],names={A:'Read with context',B:'Subject overview',C:'Connected reading'};
let variant=new URLSearchParams(location.search).get('variant')||'B',state={note:'harbor_hub',dirtyByNote:{},drafts:{},undo:false,drawer:null,source:null};if(!variants.includes(variant))variant='B';
const notes={project:{title:'Harbor · current delivery plan',purpose:'project account',protected:false,version:4,change:'13 October · BRN · source update'},requirements:{title:'Loading requirements',purpose:'process explanation',protected:false,version:2,change:'13 October · BRN · explanation saved'},commitment:{title:'Signed delivery reference',purpose:'imported reference',protected:true,version:1,change:'13 October · full reference imported'},comparison:{title:'Fixed-slot or tidal access?',purpose:'comparison',protected:false,version:1,change:'13 October · BRN · comparison saved'}};
Object.assign(notes,{harbor_hub:{title:'Harbor project',purpose:'topic index',protected:false,version:2,change:'13 October · topic links maintained'},logistics_hub:{title:'Logistics',purpose:'topic index',protected:false,version:1,change:'13 October · index saved'},operations_hub:{title:'Operations',purpose:'topic index',protected:false,version:1,change:'13 October · index saved'}});
const hubs={harbor_hub:{summary:'Delivery planning, loading conditions and the retained agreement.',members:[['project','Current planning account and unresolved date discrepancy.'],['requirements','Reported cargo and loading-depth constraints.'],['commitment','Protected imported reference; inspect its original wording.']]},logistics_hub:{summary:'Loading conditions and alternative access processes.',members:[['requirements','Loading conditions shared with the Harbor project.'],['comparison','Compare fixed slots and tidal access.']]},operations_hub:{summary:'Working plans and reusable operating procedures.',members:[['project','Harbor delivery planning.'],['comparison','Access-process comparison for future decisions.']]}};
const demoLinks=Object.entries(hubs).flatMap(([from,h])=>h.members.map(([to])=>({from,to,relation:'indexes'}))).concat([{from:'project',to:'requirements',relation:'related'},{from:'project',to:'commitment',relation:'reference'},{from:'requirements',to:'comparison',relation:'related'}]);
let composerDrafts={};
let flow={topic:'harbor_hub',navMode:'topics',context:'evidence',depth:1,includeSources:false,focus:'subject',max:null,hidden:[],order:['nav','subject','context'],widths:{nav:245,subject:510,context:340},trail:[],resize:null};
const coreNoteIds=Object.keys(notes),topics=['Archive','Boats','Cargo','Delivery','Energy','Finance','Garden','Harbor','Intake','Jobs','Knowledge','Loading','Meetings','Navigation','Operations','Planning'];
const catalog=[...coreNoteIds.map(id=>({id,title:notes[id].title,searchText:id==='project'?'Delivery estimated 15 November; cargo 12 tonnes; Jaan coordinates loading':id==='requirements'?'Cargo maximum 12 tonnes; depth at least 1.2 metres':id==='comparison'?'Compare fixed slots and tidal access, wind and booking conditions':'Signed agreement reports 22 November'})),...Array.from({length:493},(_,i)=>({id:'demo-'+i,title:topics[i%16]+' · working note '+String(Math.floor(i/16)+1).padStart(2,'0'),searchText:'Synthetic navigation fixture about '+topics[i%16]+'. Reference '+i+'. No sourced claims.',fixture:true}))];
let navigation={mode:'recent',query:'',letter:'',page:0,recent:['harbor_hub','project','comparison','requirements','commitment',...catalog.slice(-7).map(n=>n.id)]};
const sources={fixed:{title:'Fixed-slot access reference',date:'12 October 2026',availability:'Full process reference retained',quote:'Tuesday 09:00–11:00 local time. Reserve 48 hours beforehand. Depth at least 1.2 metres. Medical emergencies may request an exception. No cargo-mass limit is given.'},tidal:{title:'Tidal access reference',date:'12 October 2026',availability:'Full process reference retained',quote:'Tide height at least 2.4 metres. Reserve 24 hours beforehand. Cargo at most 12 tonnes. Closes at wind of 18 metres/second or stronger. Medical exception is unspecified.'},update:{title:'Mari’s shipment update',date:'12 October 2026',availability:'Retained passage · original not rechecked',quote:'Delivery is estimated for 15 November 2026; this is not a confirmed promise. Cargo may be up to 12 tonnes. Loading requires depth of at least 1.2 metres. Meeting confirmed for 10 November.'},agreement:{title:'Signed delivery agreement',date:'1 October 2026',availability:'Full reference retained · protected',quote:'The signed agreement reports a committed delivery date of 22 November 2026. A change requires agreement by the parties.'},older:{title:'Earlier planning note',date:'8 October 2026',availability:'Original unavailable in this demo · retained excerpt',quote:'Delivery estimated for 20 November 2026. Cargo cap 12 tonnes; loading depth at least 1.2 metres. Jaan coordinates loading.'}};
const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;
const head=title=>`<div class="tile-header chrome"><span>${title}</span><span>↗ &nbsp; ⋯</span></div>`;
function title(){let n=notes[state.note];return `<div class="chips"><span class="chip mono">${n.purpose}</span><span class="chip mono ${n.protected?'protected':''}">${n.protected?'protected':'working'} · v${state.undo&&state.note==='project'?5:n.version}</span><span class="muted mono">${dirty()?'unsaved draft':'saved'}</span></div><h1>${n.title}</h1><div class="muted mono">Last accepted change · ${state.undo&&state.note==='project'?'13 October · owner · Undo preview':n.change}</div>`}
function conflict(){return `<div class="warning"><div class="label">Unresolved discrepancy</div><p>The estimate is ${state.undo?'20':'15'} November. The signed reference reports 22 November. The commitment has not been replaced.</p>${btn('Open the decision thread ↗',"openDrawer('conflict')")}</div>`}
function content(){if(hubs[state.note])return topicContent(state.note);if(notes[state.note].demo)return `<p class="summary">${notes[state.note].title}</p><p>${catalog.find(n=>n.id===state.note).searchText}</p><p>This synthetic placeholder exercises navigation among 500 notes. It supplies no researched claims, retained sources or actual BRN history.</p>${btn('Return to Harbor overview',"selectNote('project')")}`;if(state.note==='commitment')return `<p class="summary">The signed agreement reports a committed delivery date of <strong>22 November 2026</strong>.</p><p>A change requires agreement by the parties. This imported reference is protected. Protection preserves its content; it does not certify its claims or record your adoption of them.</p><h2>Source</h2><p>Signed delivery agreement, 1 October 2026.</p>${btn('Read retained evidence',"openSource('agreement')")}`;if(state.note==='requirements')return `<p class="summary">Loading depends on both cargo mass and available water depth.</p><h2>Conditions</h2><p>The reported maximum cargo is <strong>12 tonnes</strong>. Loading requires depth of <strong>at least 1.2 metres</strong>. These are separate constraints; neither establishes that a proposed passage is possible.</p>${btn('Read source passage',"openSource('update')")}<h2>Related knowledge</h2>${btn('Harbor delivery plan →',"selectNote('project')")}`;if(state.note==='comparison')return `<p class="summary">Fixed slots offer a known clock window. Tidal access depends on water height and wind conditions.</p><h2>Supported differences</h2><p>Fixed slots: Tuesday 09:00–11:00, book 48 hours ahead, depth at least 1.2 metres. Medical emergencies can request an exception.</p><p>Tidal: height at least 2.4 metres, book 24 hours ahead, cargo at most 12 tonnes. Passage closes at wind of 18 metres/second or stronger.</p><h2>Interpretation</h2><p><strong>Inference:</strong> fixed slots may be easier to plan around, while tidal access may offer timing flexibility. The tidal source gives no medical-exception rule; it remains unspecified.</p><p class="muted mono">The context rail contains the two process references supporting this comparison.</p>`;return `<p class="summary">Delivery is <strong>estimated for ${state.undo?'20':'15'} November 2026</strong>. This is working planning evidence, not a replacement for the signed commitment.${state.undo?btn('3',"openSource('older')",'citation'):btn('1',"openSource('update')",'citation')}</p>${conflict()}<h2 id="constraints">Current constraints</h2><table class="facts"><tr><th>Cargo</th><td>Up to <strong>12 tonnes</strong> ${btn('1',"openSource('update')",'citation')}</td></tr><tr><th>Loading depth</th><td>At least <strong>1.2 metres</strong> ${btn('1',"openSource('update')",'citation')}</td></tr><tr><th>Meeting</th><td><strong>10 November 2026</strong>, confirmed in Mari’s message</td></tr><tr><th>Coordination</th><td>Jaan · reported in earlier planning ${btn('3',"openSource('older')",'citation')}</td></tr></table><h2 id="evidence">How the account changed</h2><p>The 12 October message updates the earlier estimate. The planning note written on 8 October was ingested later, but remains older evidence. Its contact detail is useful; its estimate does not become newer evidence.</p><h2 id="questions">Open question</h2><p>Clarify the estimate and signed commitment before making a new promise. No external reply has been sent.</p>`}
function nav(){return `<div class="tile">${head('NOTES')}<div class="nav"><input placeholder="Filter notes" aria-label="Filter notes" oninput="filterNotes(this.value)"><div class="label">Current subjects</div>${Object.entries(notes).map(([id,n])=>`<button data-note="${id}" class="note-link ${state.note===id?'selected':''}" onclick="selectNote('${id}')">${n.title}<small>${n.protected?'protected · imported':'working knowledge'}</small></button>`).join('')}<div class="label">Browse</div><p class="muted mono">Recent · linked work · A–Z</p></div></div>`}
function contextEntries(){if(hubs[state.note]||notes[state.note].demo)return [];let ids=state.note==='comparison'?['fixed','tidal']:state.note==='commitment'?['agreement']:state.note==='requirements'?['update','older']:['update','agreement','older'];return ids.map(id=>[id,sources[id]])}
function sourceList(){return contextEntries().map(([id,s],i)=>`<div class="source"><button onclick="openSource('${id}')">${i+1}. ${s.title} ↗</button><div class="muted mono">${s.date}</div><div class="muted">${s.availability}</div></div>`).join('')}
function related(){if(variant==='B')return connectionList();if(notes[state.note].demo)return '<p class="muted">No recorded relationships in this navigation fixture.</p>';return `<div class="relation"><span class="badge mono">explains</span>${btn('Loading requirements →',"selectNote('requirements')")}</div><div class="relation"><span class="badge mono">reference</span>${btn('Signed delivery reference →',"selectNote('commitment')")}</div><div class="relation"><span class="badge mono">related</span>${btn('Fixed-slot or tidal access? →',"selectNote('comparison')")}</div>`}
function historyPreview(){if(notes[state.note].demo)return '<p class="muted">No actual BRN history in this navigation fixture.</p>';if(state.note!=='project')return `<div class="source"><strong>v${notes[state.note].version} · ${notes[state.note].protected?'Imported reference':'Saved knowledge'}</strong><p class="muted">${notes[state.note].change}</p>${btn('Inspect this note’s history →',"openDrawer('history')")}</div>`;return `<div class="source"><strong>${state.undo?'v5 · Undo preview':'v4 · Updated estimate'}</strong><p class="muted">${state.undo?'Earlier account restored as a new revision. Derived work may need reassessment.':'New planning evidence integrated; older contact retained.'}</p>${btn('Inspect exact changes →',"openDrawer('history')")}</div>`}
function foot(){return `<div class="footer"><span class="mono muted">${dirty()?'Unsaved writing · AI changes wait':notes[state.note].demo?'Synthetic fixture · no retained evidence':'Saved · evidence retained'}</span><div class="chips">${btn('Edit',"openDrawer('edit')")}${btn('Ask about this note',"openDrawer('chat')")}${btn('Changes',"openDrawer('history')")}</div></div>`}
const guard=()=>dirty()?'<div class="guard mono">Unsaved writing · dependent AI changes wait for Save or Discard. Your draft remains here.</div>':'';
function A(){return `<div class="reading">${nav()}<article class="tile">${head('NOTE · READING')}${guard()}<div class="body">${title()}${content()}</div>${foot()}</article><aside class="tile">${head('NOTE CONTEXT')}<div class="context"><section><div class="label">Evidence</div>${sourceList()}</section><section><div class="label">Related notes</div>${related()}<h3>What changed</h3>${state.note==='project'?historyPreview():'<p class="muted">Inspect this note’s accepted revisions in history.</p>'}</section></div></aside></div>`}
function B(){return flowView()}
function C(){return `<div class="connections"><aside class="tile">${head('CONNECTIONS')}<div class="map"><div class="label">Incoming evidence</div>${contextEntries().map(([id,s])=>`<button class="node" onclick="openSource('${id}')">${s.title}<small>${s.date} · source</small></button><div class="edge mono">↓ supports reported account</div>`).join('')}<div class="node current">${notes[state.note].title}<small>${notes[state.note].protected?'protected reference':'working knowledge'} · selected subject</small></div><div class="label">Related knowledge</div>${Object.entries(notes).filter(([id])=>id!==state.note).map(([id,n])=>`<button class="node" onclick="selectNote('${id}')">${n.title}<small>${n.protected?'protected reference':'related working note'} →</small></button>`).join('')}</div>${state.note==='project'?'<div class="outline"><div class="label">In this note</div><a href="#constraints">Current constraints</a><a href="#evidence">How the account changed</a><a href="#questions">Open question</a></div>':''}</aside><article class="tile">${head('CONNECTED READING')}${guard()}<div class="split-read"><div class="body">${title()}${content()}</div><aside class="evidence-margin"><div class="label">Evidence close to the text</div><p class="quote">${contextEntries().length?contextEntries()[0][1].quote.slice(0,130)+'…':'No retained evidence in this synthetic navigation fixture.'}</p>${contextEntries().length?btn('Inspect passage →',`openSource('${contextEntries()[0][0]}')`):''}<h3>Evidence boundaries</h3><p>Source reports, AI interpretation and owner decisions remain distinguishable.</p>${state.note==='project'?btn('Open decision thread →',"openDrawer('conflict')"):''}<h3>Version history</h3>${state.note==='project'?historyPreview():'<p class="muted">History is scoped to the selected note.</p>'}</aside></div>${foot()}</article></div>`}
function render(){document.body.classList.toggle('flow-active',variant==='B');refreshDemoIndex();document.getElementById('app').innerHTML=({A,B,C}[variant])()+`<div class="state mono">DEMO STATE ${JSON.stringify({variant,note:state.note,protected:notes[state.note].protected,dirty:dirty(),undoPreview:state.undo,context:variant==='B'?flow.context:state.drawer,navigation:variant==='B'?{mode:flow.navMode,query:navigation.query,page:navigation.page,topic:flow.topic}:state.drawer==='library'?navigation:null,tiles:variant==='B'?{focus:flow.focus,max:flow.max,hidden:flow.hidden,order:flow.order,depth:flow.depth,includeSources:flow.includeSources,widths:flow.widths,composerDestination:['chat','conflict'].includes(flow.context)?composerKey():null,composerHasDraft:['chat','conflict'].includes(flow.context)?!!composerDrafts[composerKey()]:false}:null})}\nPurpose labels and note-centered context are proposals. No BRN state is read or changed.</div>`;document.getElementById('variant-label').textContent=variant+' · '+names[variant];document.getElementById('status').textContent='idle · '+(dirty()?'unsaved draft':state.undo&&state.note==='project'?'Undo preview · v5':'saved note · v'+(state.undo&&state.note==='project'?5:notes[state.note].version))+' · '+(document.body.classList.contains('theme-dark')?'Virmalised':'Sammal');if(variant==='B')fitFlow()}
function cycle(delta){state.drawer=null;document.getElementById('drawer').classList.add('hidden');variant=variants[(variants.indexOf(variant)+delta+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render();window.scrollTo(0,0)}
function selectNote(id){if(variant==='B')return flowSelect(id);if(!notes[id]){let n=catalog.find(n=>n.id===id);notes[id]={title:n.title,purpose:'navigation fixture',protected:false,version:1,change:'Synthetic fixture · no recorded BRN change',demo:true}}state.note=id;navigation.recent=[id,...navigation.recent.filter(n=>n!==id)].slice(0,12);closeDrawer();window.scrollTo(0,0)}
function filterNotes(text){document.querySelectorAll('[data-note]').forEach(el=>el.style.display=notes[el.dataset.note].title.toLowerCase().includes(text.toLowerCase())?'block':'none')}
function closeDrawer(){if(variant==='B'){flow.context='evidence';flow.hidden=flow.hidden.filter(id=>id!=='context')}state.drawer=null;document.getElementById('drawer').classList.add('hidden');render()}
function openSource(id){state.source=id;openDrawer('source')}
function openDrawer(type){if(variant==='B'){flow.context=type;flow.hidden=flow.hidden.filter(id=>id!=='context');flow.max=null;state.drawer=null;render();focusFlowTile('context');return}state.drawer=type;let body='';if(type==='library')body=libraryBody();if(type==='source'){let s=sources[state.source];body=`<div class="label">Evidence · supplied source</div><h2>${s.title}</h2><p class="mono muted">${s.date}<br>${s.availability}</p><div class="excerpt">${s.quote}</div><p class="muted">This is a retained passage. Attribution supplies evidence, rather than owner authority.</p>${state.source==='agreement'?btn('Read retained reference note',"selectNote('commitment')"):''}`}if(type==='conflict')body=`<div class="label">Thread · Needs you</div><h2>Clarify Harbor’s delivery date</h2><p>Mari reports an estimate of 15 November. The signed reference records 22 November. Both remain visible.</p><div class="excerpt">What should we communicate about the estimate and existing commitment?</div><textarea aria-label="Draft reply" placeholder="Discuss the decision here…"></textarea><p class="muted mono">Prototype composer · no message is sent</p>${btn('Preview decision review',"toast('A concrete proposed change would be reviewed here. This demo supplies no authority or commitment.')")}`;if(type==='history'&&state.note==='project')body=`<div class="label">Recorded changes</div><h2>Harbor note history</h2><div class="history-row"><strong>v4 · BRN integrated supplied evidence</strong><p>Reason: updated estimate, retained older contact and source qualifications.</p><div class="excerpt">Before: estimated 20 November<br>After: estimated 15 November; reference still 22 November.</div></div><p class="muted">Undo records a new compensating revision. Later changes can require reviewed compensation.</p><button onclick="previewUndo()" ${dirty()?'disabled':''}>Preview Undo of this update</button><p class="mono muted">${dirty()?'Save or discard the demo draft first.':'Synthetic operation · no external effects.'}</p>${btn('Reset demo',"resetDemo()")}`;if(type==='history'&&state.note!=='project')body=`<div class="label">Recorded changes</div><h2>${notes[state.note].title}</h2><p>v${notes[state.note].version} · ${notes[state.note].change}</p><p class="muted">This demo models Undo for the Harbor update only. A native history view must show this note’s actual receipts.</p>`;if(type==='chat')body=`<div class="label">Linked thread</div><h2>Ask about ${notes[state.note].title}</h2><p class="muted">The note and its evidence stay available beside the discussion.</p><textarea aria-label="Question" placeholder="Ask a question or delegate work…"></textarea>${btn('Preview answer context',"toast('This would retrieve current knowledge and available evidence. The prototype does not call a model.')")}`;if(type==='edit')body=`<div class="label">Your writing</div><h2>Edit this note</h2><p>Human writing stays coordinated with AI maintenance, including on protected notes.</p><textarea aria-label="Demo edit" oninput="setDirty(this.value)">${escapeText(state.drafts[state.note]||"Write a demo passage here…")}</textarea><div class="chips">${btn('Save demo draft',"finishDraft('saved')")}${btn('Discard demo draft',"finishDraft('discarded')")}</div><p class="mono muted">Simulated editor; draft text is not persisted.</p>`;let d=document.getElementById('drawer');d.innerHTML=`<div class="tile-header chrome"><span>CONTEXT</span><button class="close" onclick="closeDrawer()" aria-label="Close context">×</button></div><div class="body">${body}</div>`;d.classList.toggle('library',type==='library');d.classList.remove('hidden');render();if(type==='library')renderLibrary()}
function dirty(){return !!state.dirtyByNote[state.note]}
function escapeText(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function setDirty(value){state.dirtyByNote[state.note]=true;state.drafts[state.note]=value;if(variant==='B'){let g=document.querySelector('[data-guard]');if(g)g.innerHTML=guard();document.getElementById('status').textContent='idle · unsaved draft · '+(document.body.classList.contains('theme-dark')?'Virmalised':'Sammal');updateDemoState();return}render()}
function finishDraft(outcome){delete state.dirtyByNote[state.note];if(outcome==='discarded')delete state.drafts[state.note];closeDrawer();toast('Demo draft '+outcome+'. A waiting change would recheck current versions.')}
function previewUndo(){state.undo=true;closeDrawer();toast('Undo preview: earlier account restored as v5; protected reference preserved. Derived work may need refresh.')}
function resetDemo(){state={note:'project',dirtyByNote:{},drafts:{},undo:false,drawer:null,source:null};closeDrawer()}
let timer;function toast(text){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);clearTimeout(timer);timer=setTimeout(()=>n.remove(),6000)}

function libraryBar(){return `<div class="library-bar">${btn('Browse 500 notes',"openLibrary('all')")}${btn('Recent',"openLibrary('recent')")}${btn('Linked to this note',"openLibrary('linked')")}<span class="muted mono">Search titles or text · ⌘K</span></div>`}
function libraryBody(){return `<div class="label">Notes library · 500 synthetic notes</div><h2>Find your next note</h2><div class="library-filters">${btn('Recent',"browseLibrary('recent')")}${btn('Linked to this note',"browseLibrary('linked')")}${btn('Protected & imported',"browseLibrary('protected')")}${btn('All A–Z',"browseLibrary('all')")}</div><input id="library-query" class="library-search" aria-label="Search 500 notes" placeholder="Search titles or note text…" value="${escapeText(navigation.query).replaceAll('"','&quot;')}" oninput="searchLibrary(this.value)" onkeydown="if(event.key==='Enter'){let n=libraryRows()[navigation.page*12];if(n)selectNote(n.id)}"><select aria-label="Starting letter" onchange="navigation.letter=this.value;navigation.page=0;renderLibrary()"><option value="">All starting letters</option>${[...new Set(catalog.map(n=>n.title[0]))].sort().map(l=>`<option ${navigation.letter===l?'selected':''}>${l}</option>`).join('')}</select><div id="library-results"></div><p class="muted mono">Demo search matches text. All notes and search results are synthetic; no AI is called.</p>`}

function refreshDemoIndex(){let current=state.note;for(let n of catalog){if(!n.fixture){state.note=n.id;n.bodyText=new DOMParser().parseFromString(content().replace(/<\/(p|h1|h2|h3|td|th|tr|div|table|button)>/g,' </$1>'),'text/html').body.textContent.replace(/\s+/g,' ').trim()}else n.bodyText=n.searchText+' This synthetic placeholder exercises navigation among 500 notes. It supplies no researched claims, retained sources or actual BRN history.'}state.note=current}
function resultSnippet(n){let q=navigation.query.trim().toLowerCase(),index=q?n.bodyText.toLowerCase().indexOf(q):-1,start=Math.max(0,index-45);return (start?'…':'')+n.bodyText.slice(start,start+160)+(start+160<n.bodyText.length?'…':'')}

function libraryRows(){let rows=catalog.slice();if(navigation.query.trim()){let q=navigation.query.trim().toLowerCase();rows=rows.filter(n=>(n.title+' '+n.bodyText).toLowerCase().includes(q))}else if(navigation.mode==='recent')rows=navigation.recent.map(id=>catalog.find(n=>n.id===id));else if(navigation.mode==='linked')rows=notes[state.note].demo?[]:coreNoteIds.filter(id=>id!==state.note).map(id=>catalog.find(n=>n.id===id));else if(navigation.mode==='protected')rows=rows.filter(n=>notes[n.id]?.protected);if(navigation.letter)rows=rows.filter(n=>n.title.startsWith(navigation.letter));if(navigation.mode!=='recent'||navigation.query.trim())rows.sort((a,b)=>a.title.localeCompare(b.title));return rows}
function renderLibrary(){let rows=libraryRows(),start=navigation.page*12,shown=rows.slice(start,start+12);document.getElementById('library-results').innerHTML=`<div class="library-count mono">${navigation.query.trim()?'Search':navigation.mode} · ${rows.length} ${rows.length===1?'match':'matches'} · ${rows.length?'showing '+(start+1)+'–'+(start+shown.length):'no matches'}</div>${shown.map(n=>`<button class="library-result" onclick="selectNote('${n.id}')">${n.title}<small>${escapeText(resultSnippet(n))}</small></button>`).join('')||'<p>No matching notes. Try another word or clear the search.</p>'}<div class="chips">${navigation.page?btn('Previous 12',"navigation.page--;renderLibrary()") :''}${start+12<rows.length?btn('Next 12',"navigation.page++;renderLibrary()") :''}</div>`;render()}
function openLibrary(mode){if(variant==='B'){showFlowNav(mode==='recent'?'recent':'search');return}navigation.mode=mode;navigation.query='';navigation.letter='';navigation.page=0;openDrawer('library');document.getElementById('library-query').focus()}
function browseLibrary(mode){navigation.mode=mode;navigation.query='';navigation.letter='';navigation.page=0;openDrawer('library')}
function searchLibrary(value){if(variant==='B'){flowQuery(value);return}navigation.query=value;navigation.page=0;if(state.drawer!=='library')openDrawer('library');else renderLibrary()}


// Owner-selected B flow. All state and links below are synthetic and session-only.
function topicContent(id){let h=hubs[id];return `<p class="summary">${h.summary}</p><p>Use this page as an entry point. Each linked note keeps its own account, evidence and history.</p><h2>Start here</h2>${h.members.map(([note,why])=>`<section class="topic-entry">${btn(notes[note].title,`flowSelect('${note}')`)}<p>${why}</p><span class="mono muted">${notes[note].protected?'protected reference':'working note'} · v${notes[note].version}</span></section>`).join('')}<h2>Also useful</h2><p>A note can be linked from more than one topic page without duplicating it.</p>${btn('Search the notes',"showFlowNav('search')")}`}
function flowHeader(label,id){return `<header class="tile-header chrome" draggable="true" ondragstart="dragFlowTile(event,'${id}')" ondragover="event.preventDefault()" ondrop="dropFlowTile(event,'${id}')" ondblclick="maximizeTile('${id}')"><span>${label}</span><span class="tile-controls"><button aria-label="Focus ${label}" onclick="event.stopPropagation();focusFlowTile('${id}')">·</button><button aria-label="Maximize ${label}" onclick="event.stopPropagation();maximizeTile('${id}')">${flow.max===id?'↙':'↗'}</button><button aria-label="Close ${label}" onclick="event.stopPropagation();closeFlowTile('${id}')">×</button></span></header>`}
function flowNav(){return `${flowHeader('TOPICS & SEARCH','nav')}<div class="tile-scroll"><div class="flow-modes">${['topics','search','recent'].map(mode=>btn(mode==='topics'?'Topics':mode==='search'?'Search':'Recent',`showFlowNav('${mode}')`,flow.navMode===mode?'active':'')).join('')}</div><input id="tile-query" class="flow-search" aria-label="Search 500 notes" placeholder="Search title or text · ⌘K" value="${escapeText(navigation.query).replaceAll('"','&quot;')}" oninput="flowQuery(this.value)" onkeydown="if(event.key==='Enter'){let n=flowRows()[navigation.page*12];if(n)flowSelect(n.id)}"><div id="tile-nav-content">${flow.navMode==='topics'?topicRows():flowResultRows()}</div><p class="flow-help mono">500 synthetic notes · literal text search<br>Topic pages are linked notes, not folders.</p></div>`}
function topicRows(){return `<div class="label">Topic pages · ${Object.keys(hubs).length}</div>${Object.entries(hubs).map(([id,h])=>`<button class="topic-row ${flow.topic===id?'selected':''}" onclick="flow.topic='${id}';flowSelect('${id}')">${notes[id].title}<small>${h.members.length} linked notes · ${h.summary}</small></button>`).join('')}<div class="label" style="margin-top:24px">Browse the library</div>${btn('All 500 notes →',"showFlowNav('search')")}`}
function flowRows(){let rows=catalog.slice(),q=navigation.query.trim().toLowerCase();if(q)rows=rows.filter(n=>(n.title+' '+n.bodyText).toLowerCase().includes(q));else if(flow.navMode==='recent')rows=navigation.recent.map(id=>catalog.find(n=>n.id===id));if(q||flow.navMode!=='recent')rows.sort((a,b)=>a.title.localeCompare(b.title));return rows}
function flowResultRows(){let rows=flowRows(),start=navigation.page*12,shown=rows.slice(start,start+12);return `<div class="library-count mono">${rows.length} ${rows.length===1?'match':'matches'} · ${rows.length?(start+1)+'–'+(start+shown.length):'no results'}</div>${shown.map(n=>`<button class="library-result" onclick="flowSelect('${n.id}')">${n.title}<small>${escapeText(resultSnippet(n))}</small></button>`).join('')||'<p>No notes found. Clear the query or try another word.</p>'}<div class="chips" style="margin-top:12px">${navigation.page?btn('Previous 12',"navigation.page--;renderFlowResults()") :''}${start+12<rows.length?btn('Next 12',"navigation.page++;renderFlowResults()") :''}</div>`}
function flowSubject(){return `${flowHeader(hubs[state.note]?'TOPIC PAGE':'SUBJECT OVERVIEW','subject')}<div data-guard>${guard()}</div><div class="flow-subject-title">${title()}</div><div class="tile-scroll body">${content()}</div><div class="footer"><span class="mono muted">${dirty()?'Unsaved writing · AI changes wait':'Saved demo note · v'+(state.undo&&state.note==='project'?5:notes[state.note].version)}</span><span class="chips">${btn('Write',"openDrawer('edit')")}${btn('Connections',"setFlowContext('connections')")}${btn('Changes',"setFlowContext('history')")}</span></div>`}
function flowContext(){let label={evidence:'EVIDENCE CHRONOLOGY',connections:'CONNECTIONS',source:'SOURCE PASSAGE',history:'RECORDED CHANGES',edit:'WRITING',chat:'LINKED THREAD',conflict:'DECISION THREAD'}[flow.context]||'NOTE CONTEXT';return `${flowHeader(label,'context')}<div class="context-tabs">${btn('Evidence',"setFlowContext('evidence')",flow.context==='evidence'?'active':'')}${btn('Connections',"setFlowContext('connections')",flow.context==='connections'?'active':'')}${btn('Changes',"setFlowContext('history')",flow.context==='history'?'active':'')}</div><div class="tile-scroll">${contextContent()}</div>`}
function composerKey(){return flow.context==='conflict'?'thread:harbor-delivery-discrepancy':'chat:'+state.note}
function contextContent(){if(flow.context==='connections')return localGraph();if(flow.context==='source'){let s=sources[state.source];return `<div class="label">Retained evidence</div><h2>${s.title}</h2><p class="mono muted">${s.date}<br>${s.availability}</p><div class="excerpt">${s.quote}</div><p class="muted" style="font-size:12px">A retained passage preserves what was supplied. Its claims remain source reports.</p>${btn('Back to evidence',"setFlowContext('evidence')")}${btn('Back to Connections',"setFlowContext('connections')")}`}if(flow.context==='edit')return `<div class="label">Demo writing buffer</div><h2>${notes[state.note].title}</h2><textarea id="tile-draft" class="tile-textarea" aria-label="Demo edit" oninput="setDirty(this.value)">${escapeText(state.drafts[state.note]||'Write a demo passage here…')}</textarea><div class="chips">${btn('Save demo draft',"finishDraft('saved')")}${btn('Discard demo draft',"finishDraft('discarded')")}</div><p class="flow-help mono">Memory-only writing example · AI changes wait while dirty.</p>`;if(flow.context==='history'){if(state.note!=='project')return `<h2>${notes[state.note].title}</h2>${historyPreview()}<p class="flow-help">The full checked receipt would be inspected here.</p>`;return `<h2>Harbor note history</h2><div class="history-row"><strong>v4 · Supplied update integrated</strong><p>Estimated 20 November → estimated 15 November. Protected reference still reports 22 November.</p></div><p class="muted" style="font-size:12px">Undo records compensation as a new revision. Later work may require reviewed compensation.</p><button id="tile-undo" onclick="previewUndo()" ${dirty()?'disabled':''}>Preview Undo of this update</button><p class="flow-help">${dirty()?'Save or discard the demo draft first.':'Synthetic operation; no BRN data changes.'}</p>${btn('Reset demo',"resetFlow(true)")}`};if(flow.context==='chat'||flow.context==='conflict')return `<div class="label">${flow.context==='conflict'?'Needs you · discrepancy':'Linked thread'}</div><h2>${flow.context==='conflict'?'Clarify Harbor’s delivery date':'Ask about '+notes[state.note].title}</h2><p>${flow.context==='conflict'?'The estimate and signed reference remain visible. Discuss the discrepancy before making a new promise.':'The current note and evidence stay available beside this conversation.'}</p><textarea class="tile-textarea" aria-label="Demo thread reply" placeholder="Write a reply…" oninput="composerDrafts[composerKey()]=this.value;updateDemoState()">${escapeText(composerDrafts[composerKey()]||'')}</textarea><p class="flow-help mono">Demo composer · no message is sent</p>`;let evidence=contextEntries().sort(([,a],[,b])=>a.date.localeCompare(b.date,undefined,{numeric:true}));return `<div class="label">${evidence.length?'Evidence dates':'Index context'}</div>${evidence.length?`<div class="timeline">${evidence.map(([id,s])=>`<article><span class="mono muted">${s.date}</span><h3>${s.title}</h3><p>${s.availability}</p>${btn('Inspect passage →',`openSource('${id}')`)}</article>`).join('')}</div>`:`<p class="muted" style="font-size:13px">${hubs[state.note]?'This topic page points to knowledge notes. Inspect each note’s evidence from its subject overview.':'No supporting sources in this navigation fixture.'}</p>`}<h3>Related notes</h3>${connectionList()}<h3>What changed</h3>${historyPreview()}`}
function connectionList(){let ids=[...new Set(demoLinks.filter(l=>l.from===state.note||l.to===state.note).map(l=>l.from===state.note?l.to:l.from))];return ids.length?ids.map(id=>`<div class="graph-row">${btn(notes[id].title,`flowSelect('${id}')`)}<div class="mono muted">${demoLinks.filter(l=>l.from===state.note&&l.to===id||l.to===state.note&&l.from===id).map(l=>l.from===state.note?'→ '+l.relation:'← '+l.relation).join(' · ')}</div></div>`).join(''):'<p class="muted" style="font-size:12px">No recorded demo links.</p>'}
function graphData(){let edges=demoLinks.map(l=>({...l}));if(flow.includeSources)for(let id of coreNoteIds){let current=state.note;state.note=id;let refs=contextEntries();state.note=current;edges.push(...refs.map(([source])=>({from:id,to:'source:'+source,relation:'source'})))}let ids=new Set([state.note]),front=[state.note];for(let hop=0;hop<flow.depth;hop++){let next=[];for(let id of front)for(let l of edges)if(l.from===id||l.to===id){let other=l.from===id?l.to:l.from;if(!ids.has(other)){ids.add(other);next.push(other)}}front=next}let all=[...ids].filter(id=>id!==state.note),visible=all.slice(0,8);return {all,visible,edges:edges.filter(l=>ids.has(l.from)&&ids.has(l.to)),shownEdges:edges.filter(l=>[state.note,...visible].includes(l.from)&&[state.note,...visible].includes(l.to))}}
function graphLabel(id){return id.startsWith('source:')?sources[id.slice(7)].title:notes[id]?.title||id}
function graphOpen(id){if(id.startsWith('source:'))openSource(id.slice(7));else flowSelect(id,'connections')}
function graphNode(id,x,y,root=false){let title=graphLabel(id),words=title.split(' '),lines=['',''],row=0;for(let word of words){if(row===0&&lines[0]&&lines[0].length+word.length+1>17)row=1;lines[row]+=(lines[row]?' ':'')+word}lines=lines.map(l=>l.length>18?l.slice(0,15)+'…':l);let meta=root?'current note':id.startsWith('source:')?'source':hubs[id]?'topic index':notes[id]?.protected?'protected reference':'working note';return `<g class="graph-node ${root?'root':''} ${notes[id]?.protected?'protected':''}" role="button" tabindex="0" aria-label="Open ${escapeText(title)}" onclick="graphOpen('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();graphOpen('${id}')}" transform="translate(${x},${y})"><title>${escapeText(title)}</title><rect x="-59" y="-30" width="118" height="60" rx="0"/><text text-anchor="middle" y="-9">${escapeText(lines[0])}</text><text text-anchor="middle" y="5">${escapeText(lines[1])}</text><text class="node-meta" text-anchor="middle" y="24">${meta}</text></g>`}
function localGraph(){let graph=graphData(),positions={};positions[state.note]=[210,205];graph.visible.forEach((id,i)=>{let angle=-Math.PI/2+2*Math.PI*i/graph.visible.length;positions[id]=[210+140*Math.cos(angle),205+140*Math.sin(angle)]});return `<div class="label">Local graph · ${flow.depth===1?'direct links':'up to two hops'}</div><p class="muted" style="font-size:12px;margin:8px 0">${graph.visible.length} of ${graph.all.length} connected records shown · click to open and recenter</p><div class="graph-options"><label>Depth <select aria-label="Graph depth" onchange="flow.depth=Number(this.value);render()"><option value="1" ${flow.depth===1?'selected':''}>1 · direct</option><option value="2" ${flow.depth===2?'selected':''}>2 · expand</option></select></label><label><input type="checkbox" aria-label="Include source records" ${flow.includeSources?'checked':''} onchange="flow.includeSources=this.checked;render()"> Sources</label></div><svg class="local-graph" viewBox="0 0 420 410" role="group" aria-label="Local connections for ${escapeText(notes[state.note].title)}"><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--line)"/></marker></defs>${graph.shownEdges.map(l=>{let a=positions[l.from],b=positions[l.to],dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy),offset=Math.min(62,length*.35),x1=a[0]+dx/length*offset,y1=a[1]+dy/length*offset,x2=b[0]-dx/length*offset,y2=b[1]-dy/length*offset;return `<line class="graph-edge ${l.relation==='source'?'source':''} ${l.from!==state.note&&l.to!==state.note?'secondary':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#arrow)"><title>${l.relation}</title></line>`}).join('')}${graphNode(state.note,...positions[state.note],true)}${graph.visible.map(id=>graphNode(id,...positions[id])).join('')}</svg><div class="label">Connections as a list</div>${graph.visible.map(id=>{let direct=graph.shownEdges.filter(l=>l.from===state.note&&l.to===id||l.to===state.note&&l.from===id),relations=direct.map(l=>l.from===state.note?'→ '+l.relation:'← '+l.relation);return `<div class="graph-row">${btn(graphLabel(id),`graphOpen('${id}')`)}<div class="mono muted">${relations.length?relations.join(' · '):'via another linked note'}</div></div>`}).join('')||'<p class="muted">No linked records in this fixture.</p>'}<p class="flow-help mono">Links show recorded context; they do not certify claims. Limit: 8 neighbors.</p>`}
function fitFlow(){let strip=document.querySelector('.flow-strip');if(strip)strip.style.height=Math.max(280,innerHeight-strip.getBoundingClientRect().top-scrollY-(innerWidth<760?170:128))+'px'}
addEventListener('resize',()=>{if(variant==='B')fitFlow()});
function flowView(){let visible=flow.order.filter(id=>!flow.hidden.includes(id)&&(!flow.max||flow.max===id)),parts={nav:flowNav,subject:flowSubject,context:flowContext};return `<div class="flow-shell"><nav class="flow-bar" aria-label="Reading path">${btn('Topics',"showFlowNav('topics')")}<span>/</span>${btn(notes[flow.topic].title,`flowSelect('${flow.topic}')`)}<span>/</span><span>${hubs[state.note]?'Topic index':notes[state.note].title}</span><span class="spacer"></span>${flow.trail.length?btn('← Previous note',"flowBack()") :''}${btn('Open tiles',"restoreFlowTiles()")}${btn('Start flow',"resetFlow()")}</nav><div class="flow-strip" style="--nav-width:${flow.widths.nav}px;--subject-width:${flow.widths.subject}px;--context-width:${flow.widths.context}px">${visible.map((id,i)=>`<section class="tile flow-tile ${flow.focus===id?'focused':''} ${flow.max===id?'maximized':''}" data-tile="${id}" tabindex="0" onpointerdown="focusFlowTile('${id}',false)">${parts[id]()}</section>${i<visible.length-1?`<div class="flow-gap" role="separator" aria-label="Resize ${id} tile" onpointerdown="resizeFlow(event,'${id}')"></div>`:''}`).join('')}</div><div class="flow-help mono">⌘K search · ⌘[ / ⌘] focus tile · double-click header to maximize · drag header to swap · drag gap to resize</div></div>`}
function flowSelect(id,context=null,remember=true){if(!notes[id]){let n=catalog.find(n=>n.id===id);notes[id]={title:n.title,purpose:'navigation fixture',protected:false,version:1,change:'Synthetic fixture · no recorded BRN change',demo:true}}if(remember&&id!==state.note)flow.trail.push(state.note);if(hubs[id]){flow.topic=id;flow.navMode='topics';navigation.query='';navigation.page=0}state.note=id;navigation.recent=[id,...navigation.recent.filter(n=>n!==id)].slice(0,12);flow.context=context||'evidence';flow.hidden=flow.hidden.filter(t=>t!=='subject'&&t!=='context');flow.max=null;flow.focus='subject';state.drawer=null;render();focusFlowTile('subject')}
function flowBack(){let id=flow.trail.pop();if(id)flowSelect(id,null,false)}
function showFlowNav(mode){flow.navMode=mode;navigation.query='';navigation.page=0;flow.hidden=flow.hidden.filter(id=>id!=='nav');flow.max=null;flow.focus='nav';state.drawer=null;render();if(mode!=='topics')document.getElementById('tile-query').focus()}
function flowQuery(value){navigation.query=value;navigation.page=0;flow.navMode='search';renderFlowResults()}
function renderFlowResults(){document.getElementById('tile-nav-content').innerHTML=flowResultRows();document.querySelectorAll('[data-tile="nav"] .flow-modes button').forEach((el,i)=>el.classList.toggle('active',i===1));updateDemoState()}
function setFlowContext(mode){flow.context=mode;flow.hidden=flow.hidden.filter(id=>id!=='context');flow.max=null;flow.focus='context';render();focusFlowTile('context')}
function updateDemoState(){let el=document.querySelector('.state');if(el)el.textContent='DEMO STATE '+JSON.stringify({variant,note:state.note,protected:notes[state.note].protected,dirty:dirty(),context:flow.context,navigation:{mode:flow.navMode,query:navigation.query,page:navigation.page,topic:flow.topic},tiles:{focus:flow.focus,max:flow.max,hidden:flow.hidden,order:flow.order,depth:flow.depth,includeSources:flow.includeSources,widths:flow.widths,composerDestination:['chat','conflict'].includes(flow.context)?composerKey():null,composerHasDraft:['chat','conflict'].includes(flow.context)?!!composerDrafts[composerKey()]:false}})+'\nSynthetic, memory-only state. No BRN records are read or changed.'}
function focusFlowTile(id,moveFocus=true){flow.focus=id;document.querySelectorAll('[data-tile]').forEach(el=>el.classList.toggle('focused',el.dataset.tile===id));if(moveFocus){let el=document.querySelector(`[data-tile="${id}"]`);el?.focus();el?.scrollIntoView({block:'nearest',inline:'nearest'})}updateDemoState()}
function cycleTile(delta){let visible=flow.order.filter(id=>!flow.hidden.includes(id)&&(!flow.max||flow.max===id));focusFlowTile(visible[(visible.indexOf(flow.focus)+delta+visible.length)%visible.length])}
function maximizeTile(id){flow.max=flow.max===id?null:id;flow.focus=id;render()}
function closeFlowTile(id){if(flow.hidden.length>=2)return;flow.hidden.push(id);flow.max=null;flow.focus=flow.order.find(t=>!flow.hidden.includes(t));render()}
function restoreFlowTiles(){flow.hidden=[];flow.max=null;render()}
function dragFlowTile(event,id){event.dataTransfer.setData('text/plain',id)}
function dropFlowTile(event,id){event.preventDefault();let from=event.dataTransfer.getData('text/plain'),a=flow.order.indexOf(from),b=flow.order.indexOf(id);if(a>=0&&b>=0){[flow.order[a],flow.order[b]]=[flow.order[b],flow.order[a]];render()}}
function resizeFlow(event,id){event.preventDefault();let strip=document.querySelector('.flow-strip'),tile=document.querySelector(`[data-tile="${id}"]`),start=event.clientX,width=tile.getBoundingClientRect().width;function move(e){let next=Math.max(id==='subject'?330:210,Math.min(800,width+e.clientX-start));flow.widths[id]=next;strip.style.setProperty('--'+id+'-width',next+'px');if(id==='subject')tile.style.flex='0 0 '+next+'px'}function up(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);updateDemoState()}document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)}
function flowLayout(mode){if(variant!=='B'){toast('Layout preview is available in B.');return}if(mode==='solo')flow.max=flow.focus;else{flow.hidden=[];flow.max=null;flow.context='evidence'}render()}
function resetFlow(clear=false){if(clear){state.dirtyByNote={};state.drafts={};state.undo=false;composerDrafts={}}state.note='harbor_hub';flow={topic:'harbor_hub',navMode:'topics',context:'evidence',depth:1,includeSources:false,focus:'subject',max:null,hidden:[],order:['nav','subject','context'],widths:{nav:245,subject:510,context:340},trail:[],resize:null};navigation.query='';navigation.page=0;state.drawer=null;window.scrollTo(0,0);render()}
function toggleTheme(){document.body.classList.toggle('theme-dark');document.querySelector('.statusbar button').textContent=document.body.classList.contains('theme-dark')?'Virmalised':'Sammal'}

addEventListener('keydown',e=>{if(variant==='B'&&(e.metaKey||e.ctrlKey)&&['[',']'].includes(e.key)){e.preventDefault();cycleTile(e.key===']'?1:-1);return}if(variant==='B'&&(e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key==='Enter'){e.preventDefault();maximizeTile(flow.focus);return}if(variant==='B'&&e.key==='Escape'){e.preventDefault();flow.max=null;flow.context='evidence';render();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openLibrary('recent');(document.getElementById('tile-query')||document.getElementById('library-query')).focus();return}if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}if(e.key==='Escape')closeDrawer()});render();
</script></body></html>
