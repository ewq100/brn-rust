[package]
name = "brn-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-ui = ["dep:gpui-kit", "dep:tempfile", "brn-writing-ui/native-ui"]
native-retrieval = ["native-ui", "brn-threads-app/native-retrieval"]
native-test-support = ["native-ui", "gpui-kit/test-support", "brn-writing-ui/native-test-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brn-threads-app = { path = "../brn-threads-app" }
brn-writing-ui = { path = "../brn-writing-ui", default-features = false }
brn-threads-intake = { path = "../brn-threads-intake" }
brn-ai = { path = "../brn-ai" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
gpui-kit = { version = "=0.8.0", optional = true }
brn-intake = { path = "../brn-intake" }
tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
brn-ai = { path = "../brn-ai", features = ["scripted-runs"] }
rig = { version = "=0.45.0", default-features = false, features = ["test-utils"] }
tempfile = "3"
