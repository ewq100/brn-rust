[package]
name = "brn-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-ui = ["dep:gpui-kit", "dep:sha2", "dep:tempfile", "dep:libc"]
native-retrieval = ["native-ui", "brn-workflow/native-retrieval"]
native-test-support = ["native-ui", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.6.6", optional = true }
brn-workflow = { path = "../brn-workflow" }
brn-intake = { path = "../brn-intake" }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
brn-store = { path = "../brn-store" }
tempfile = "3"
