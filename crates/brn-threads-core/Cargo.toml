[package]
name = "brn-threads-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "=1.26.1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
