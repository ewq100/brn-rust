[package]
name = "brn-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[features]
capability-spike = []

[[example]]
name = "provider-capabilities"
path = "examples/provider_capabilities.rs"
required-features = ["capability-spike"]

[dependencies]
brn-threads-core = { path = "../brn-threads-core" }
rig = { version = "=0.43.0", default-features = false, features = ["agent", "derive", "reqwest"] }
rig-core = { version = "=0.43.0", default-features = false, features = ["rustls"] }
rig-reqwest = { version = "=0.43.0", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
# Same version Rig already locks; derives the propose_actions tool schema.
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde_json = "1"
thiserror = "2"
libc = "=0.2.189"
base64 = "0.22"

[dev-dependencies]
bytes = "1"
tempfile = "3"
rig = { version = "=0.43.0", default-features = false, features = ["test-utils"] }
