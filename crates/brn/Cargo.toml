[package]
name = "brn"
version = "0.0.0"
edition = "2021"
publish = false

[features]
native-retrieval = ["brn-threads-app/native-retrieval"]

[dependencies]
uuid = { version = "=1.26.1", features = ["v4"] }
brn-threads-app = { path = "../brn-threads-app" }
brn-threads-intake = { path = "../brn-threads-intake" }
brn-intake = { path = "../brn-intake" }
brn-ai = { path = "../brn-ai" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net"] }
