[package]
name = "brn"
version = "0.0.0"
edition = "2021"
publish = false

[features]
native-retrieval = ["brn-workflow/native-retrieval"]

[dependencies]
brn-workflow = { path = "../brn-workflow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
