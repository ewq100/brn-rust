[package]
name = "brn-xberg-intake-helper"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
autotests = false

[workspace]

[dependencies]
brn-intake = { path = "../../crates/brn-intake", default-features = false }
xberg = { version = "=1.3.10", default-features = false, features = ["pdf", "office", "excel", "email", "html"] }
serde_json = "=1.0.154"
serde = "=1.0.229"
libc = "=0.2.189"
tokio = { version = "=1.53.2", default-features = false, features = ["rt"] }
markdown = "=1.0.0"

[build-dependencies]
brn-intake = { path = "../../crates/brn-intake", default-features = false }

[[bin]]
name = "brn-xberg-helper"
path = "src/main.rs"

[[test]]
name = "eight_kinds"
path = "tests/eight_kinds.rs"

[[test]]
name = "identity"
path = "tests/identity.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0
