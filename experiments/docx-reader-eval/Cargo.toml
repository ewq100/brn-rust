[package]
name = "docx-reader-eval"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# H4 throwaway evaluator. Nothing in the product workspace depends on it.
[dependencies]
# Published release under evaluation. The optional `image` preview decoder is
# left off: BRN would only use the original-bytes seam (previews disabled).
docx-rs = { version = "=0.4.22", default-features = false }
# Same pinned versions BRN already locks; used only to build synthetic fixtures.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
crc32fast = "=1.5.2"
serde_json = "=1.0.151"

[workspace]
