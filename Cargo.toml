[workspace]
members = ["crates/brn", "crates/brn-store", "crates/brn-retrieval", "crates/brn-workflow", "crates/brn-desktop", "crates/brn-ai", "crates/brn-intake", "crates/brn-threads-core", "crates/brn-threads-intake"]
default-members = ["crates/brn"]
exclude = ["vendor/rig-agent"]
resolver = "2"

# Native retrieval/UI graphs are large; keep trial debug artifacts bounded.
[profile.dev]
debug = 0
[profile.test]
debug = 0
# Complete bounded recovery records exercise JSON/base64 byte loops repeatedly.
# Optimize test executables while retaining development assertions and checks.
opt-level = 1
debug-assertions = true
overflow-checks = true

# Full asset recovery witnesses repeatedly verify complete bounded payloads.
# Retain the higher pinned checksum optimization; keep all evidence checks.
[profile.test.package.sha2]
opt-level = 3

# Exact 0.43.0 safety patch; see vendor/README.md.
[patch.crates-io]
rig-agent = { path = "vendor/rig-agent" }
