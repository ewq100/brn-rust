[workspace]
members = ["crates/brn", "crates/brn-store", "crates/brn-retrieval", "crates/brn-workflow", "crates/brn-desktop", "crates/brn-ai", "crates/brn-intake"]
default-members = ["crates/brn"]
exclude = ["vendor/rig-agent"]
resolver = "2"

# Native retrieval/UI graphs are large; keep trial debug artifacts bounded.
[profile.dev]
debug = 0
[profile.test]
debug = 0

# Full asset recovery witnesses repeatedly verify complete bounded payloads.
# Optimize only the pinned checksum crate in tests; keep all evidence checks.
[profile.test.package.sha2]
opt-level = 3

# Exact 0.43.0 safety patch; see vendor/README.md.
[patch.crates-io]
rig-agent = { path = "vendor/rig-agent" }
