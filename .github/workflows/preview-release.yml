name: BRN macOS preview release

on:
  workflow_run:
    workflows: [BRN CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brn-macos-preview-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Package and publish approved Apple Silicon preview
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CARGO_INCREMENTAL: '0'
      BRN_NATIVE_MODEL_DIR: ''
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact main, approval and the four required CI jobs
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-preview.py gate \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.gate.outputs.eligible == 'true'
        with:
          lane: preview-release-native-ui
          native: 'true'
      - name: Fetch the committed stock lock for generator fixtures
        if: steps.gate.outputs.eligible == 'true'
        run: |
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
      - name: Check portable packaging and release guards
        if: steps.gate.outputs.eligible == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare locked stock and adapted document helpers
        if: steps.gate.outputs.eligible == 'true'
        run: |
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/xberg-1.3.10.crate"
          python3 scripts/prepare-xberg-adapted.py --archive "$archive"
          cargo fetch --locked --manifest-path target/xberg-adapted/workspace/Cargo.toml --target "$host_target"
          bash scripts/build-document-helpers.sh --offline --jobs 1 --target-root "$GITHUB_WORKSPACE/target/document-helpers"
      - name: Build locked desktop and retain target graphs
        if: steps.gate.outputs.eligible == 'true'
        run: |
          test "$(uname -m)" = arm64
          cargo rustc --release -p brn-desktop --bin brn-desktop --features native-ui --locked --offline -- -C link-arg=-mmacosx-version-min=15.0
          cargo build --release -p brn --locked --offline --jobs 1
          cargo tree --locked --offline -p brn-desktop --features native-ui --target aarch64-apple-darwin --edges normal,build --prefix none --format '{p}' > target/desktop-target-graph.txt
          python3 scripts/package-macos-preview.py --prepare-notices "$GITHUB_WORKSPACE/target/distribution-notices" --graph target/desktop-target-graph.txt --graph target/document-helpers/receipts/stock-target-graph.txt --graph target/document-helpers/receipts/adapted-target-graph.txt
      - name: Package and verify the relocated signed archive
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python3 scripts/package-macos-preview.py \
            --binary "$GITHUB_WORKSPACE/target/release/brn-desktop" \
            --xberg-helper "$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper" \
            --xberg-helper-brn "$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper-brn" \
            --notices "$GITHUB_WORKSPACE/target/distribution-notices" \
            --source-sha "$SOURCE_SHA" --output-dir "$RUNNER_TEMP/brn-preview-distribution"
      - name: Qualify packaged startup and helper using disposable fixtures
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python3 scripts/tests/test_macos_packaging.py \
            --qualify-app "$RUNNER_TEMP/brn-preview-distribution/BRN Threads.app" --host-cli "$GITHUB_WORKSPACE/target/release/brn"
      - name: Upload, verify and publish the current-main prerelease
        if: steps.gate.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-preview.py publish \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --distribution "$RUNNER_TEMP/brn-preview-distribution"
