name: BRN macOS preview release

on:
  workflow_run:
    workflows: [BRN CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brn-macos-preview-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Package and publish approved Apple Silicon preview
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CARGO_INCREMENTAL: '0'
      BRN_NATIVE_MODEL_DIR: ''
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact main, approval and the four required CI jobs
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-preview.py gate \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.gate.outputs.eligible == 'true'
        with:
          lane: preview-release-native-ui
          native: 'true'
      - name: Check portable packaging and release guards
        if: steps.gate.outputs.eligible == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build the locked native desktop and maintained helper
        if: steps.gate.outputs.eligible == 'true'
        run: |
          test "$(uname -m)" = arm64
          cargo rustc --release -p brn-desktop --bin brn-desktop --features native-ui --locked --offline -- -C link-arg=-mmacosx-version-min=15.0
          cargo rustc --release -p brn-intake --features helper --bin brn-intake-helper --locked --offline -- -C link-arg=-mmacosx-version-min=15.0
      - name: Package and verify the relocated signed archive
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python3 scripts/package-macos-preview.py \
            --binary "$GITHUB_WORKSPACE/target/release/brn-desktop" \
            --intake-helper "$GITHUB_WORKSPACE/target/release/brn-intake-helper" \
            --source-sha "$SOURCE_SHA" --output-dir "$RUNNER_TEMP/brn-preview-distribution"
      - name: Qualify packaged startup and helper using disposable fixtures
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python3 scripts/tests/test_macos_packaging.py \
            --qualify-app "$RUNNER_TEMP/brn-preview-distribution/BRN Threads.app"
      - name: Upload, verify and publish the current-main prerelease
        if: steps.gate.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-preview.py publish \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --distribution "$RUNNER_TEMP/brn-preview-distribution"
