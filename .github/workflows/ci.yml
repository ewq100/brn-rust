name: BRN CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Bounded intake spawn diagnosis (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Compare baseline, submitted PR and static fixture repair
        run: python3 scripts/diagnose-helper-spawn.py
      - name: Publish diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intake-spawn-diagnosis
          path: diagnosis-results/
