name: BRN CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI has no provider credentials and cannot modify repository content.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # Do not discover or load a developer's embedding-model directory.
  BRN_NATIVE_MODEL_DIR: ''

defaults:
  run:
    shell: bash

jobs:
  documentation:
    name: Documentation and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the committed stock lock for generator fixtures
        run: |
          rustup show
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
      - name: Check current Markdown file and fragment links
        run: python3 scripts/check-markdown-links.py
      - name: Check the generated owner overview
        run: python3 scripts/render-work-overview.py --check
      - name: Test deterministic development tooling
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check shell syntax
        if: ${{ !cancelled() }}
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

  headless:
    name: Core and CLI (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Mac also builds/tests both converters; main additionally lints the workspace.
    # Allow finalization within the same bounded hour as the native lanes.
    timeout-minutes: ${{ matrix.runner == 'macos-15' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: default
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check production provider retirement
        if: runner.os != 'Windows'
        run: python3 scripts/check-provider-retirement.py
      - name: Check production intake retirement
        if: runner.os != 'Windows'
        run: python3 scripts/check-intake-retirement.py
      - name: Prepare both locked document helper graphs
        if: runner.os != 'Windows'
        run: |
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/xberg-1.3.10.crate"
          python3 scripts/prepare-xberg-adapted.py --archive "$archive"
          cargo fetch --locked --manifest-path target/xberg-adapted/workspace/Cargo.toml --target "$host_target"
          bash scripts/build-document-helpers.sh --offline --jobs 1 --target-root "$GITHUB_WORKSPACE/target/document-helpers"
          mkdir -p target/debug
          cp target/document-helpers/artifacts/brn-xberg-helper* target/debug/
          echo "BRN_XBERG_HELPER=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper" >> "$GITHUB_ENV"
          echo "BRN_XBERG_HELPER_BRN=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper-brn" >> "$GITHUB_ENV"
      - name: Build the default workspace
        id: workspace-build
        run: cargo build --workspace --locked --offline
      - name: Lint the default workspace
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test the default workspace
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast --locked --offline
      - name: Both document helpers normal API and restrictions
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os != 'Windows' }}
        run: |
          for mode in stock adapted; do
            manifest=tools/xberg-intake-helper/Cargo.toml
            if [[ "$mode" == adapted ]]; then manifest=target/xberg-adapted/workspace/Cargo.toml; fi
            export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/document-helpers/$mode"
            cargo test --manifest-path "$manifest" --all-targets --locked --offline --jobs 1
            cargo clippy --manifest-path "$manifest" --all-targets --locked --offline --jobs 1 -- -D warnings
          done
      - name: Scripted document CLI route (no live provider)
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          cargo test -p brn --features scripted-document-tests --bin brn document_route_tests --locked --offline --jobs 1
          cargo clippy -p brn --features scripted-document-tests --all-targets --locked --offline --jobs 1 -- -D warnings
      - name: Test provider capability fixtures offline
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os != 'Windows' }}
        run: cargo test -p brn-ai --features capability-spike --all-targets --locked --offline
      - name: Lint provider capability fixtures
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os != 'Windows' }}
        run: cargo clippy -p brn-ai --features capability-spike --all-targets --locked --offline -- -D warnings
      - name: Check CLI help on Unix
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os != 'Windows' }}
        run: |
          target/debug/brn --help
      - name: Check CLI help on Windows
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          & ./target/debug/brn.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline end-to-end fixtures
        # Current Save/recovery fixtures require macOS filesystem coordination.
        if: ${{ !cancelled() && steps.workspace-build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          fixture_parent="$(mktemp -d "$RUNNER_TEMP/brn-ci-fixtures.XXXXXX")"
          fixture_parent="$(cd "$fixture_parent" && pwd -P)"
          trap 'rmdir "$fixture_parent"' EXIT
          export TMPDIR="$fixture_parent"
          bash scripts/verify-end-to-end.sh --fixtures-only

  native-ui:
    name: Native UI build and state (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Qualify Linux and Mac widgets on PRs; probe Windows on main/manual runs.
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-ui
          native: 'true'
      - name: Prepare both locked document helper graphs
        if: runner.os != 'Windows'
        run: |
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/xberg-1.3.10.crate"
          python3 scripts/prepare-xberg-adapted.py --archive "$archive"
          cargo fetch --locked --manifest-path target/xberg-adapted/workspace/Cargo.toml --target "$host_target"
          bash scripts/build-document-helpers.sh --offline --jobs 1 --target-root "$GITHUB_WORKSPACE/target/document-helpers"
          mkdir -p target/debug
          cp target/document-helpers/artifacts/brn-xberg-helper* target/debug/
          echo "BRN_XBERG_HELPER=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper" >> "$GITHUB_ENV"
          echo "BRN_XBERG_HELPER_BRN=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper-brn" >> "$GITHUB_ENV"
      - name: Build reusable writing UI on Unix
        if: runner.os != 'Windows'
        run: cargo build -p brn-writing-ui --features native-ui --locked --offline
      - name: Lint reusable writing UI on Unix
        if: runner.os != 'Windows'
        run: cargo clippy -p brn-writing-ui --features native-ui,native-test-support --all-targets --locked --offline -- -D warnings
      - name: Test reusable writing UI on Unix
        if: runner.os != 'Windows'
        run: cargo test -p brn-writing-ui --features native-ui,native-test-support --locked --offline
      - name: Build the desktop with native UI
        run: cargo build -p brn-desktop --features native-ui --locked --offline
      - name: Lint native UI
        run: cargo clippy -p brn-desktop --features native-ui --all-targets --locked --offline -- -D warnings
      - name: Test native UI state
        run: cargo test -p brn-desktop --features native-ui --locked --offline
      - name: Lint native Unix widgets
        if: runner.os != 'Windows'
        run: cargo clippy -p brn-desktop --features native-ui,native-test-support --all-targets --locked --offline -- -D warnings
      - name: Test native Unix widgets
        if: runner.os != 'Windows'
        run: |
          cargo test -p brn-desktop --features native-ui,native-test-support --bin brn-desktop threads_ui:: --locked --offline
      - name: Exercise the desktop headless driver on Unix
        if: runner.os != 'Windows'
        run: |
          fixture_parent="$(mktemp -d "$RUNNER_TEMP/brn-ci-desktop.XXXXXX")"
          fixture_parent="$(cd "$fixture_parent" && pwd -P)"
          trap 'rm -rf "$fixture_parent"' EXIT
          data="$fixture_parent/data"
          mkdir "$data"
          for attempt in 1 2; do
            target/debug/brn-desktop --data-dir "$data" --headless-check startup
          done
          test -f "$data/threads.sqlite3"
          test ! -e "$data/brn.sqlite"
      - name: Exercise the desktop headless driver on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixtureParent = Join-Path $env:RUNNER_TEMP ("brn-ci-desktop-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $fixtureParent | Out-Null
          try {
            $data = Join-Path $fixtureParent 'data'
            New-Item -ItemType Directory -Path $data | Out-Null
            foreach ($attempt in 1..2) {
              & ./target/debug/brn-desktop.exe --data-dir $data --headless-check startup
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $data 'threads.sqlite3') -PathType Leaf)) {
              throw 'Current operational database was not created'
            }
            if (Test-Path -LiteralPath (Join-Path $data 'brn.sqlite')) {
              throw 'Retired operational database was created'
            }
          } finally {
            Remove-Item -Recurse -Force $fixtureParent
          }

  native-retrieval:
    name: Native retrieval and combined build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-15"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-ui-native-retrieval
          native: 'true'
      - name: Prepare both locked document helper graphs
        if: runner.os != 'Windows'
        run: |
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          cargo fetch --locked --manifest-path tools/xberg-intake-helper/Cargo.toml --target "$host_target"
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/xberg-1.3.10.crate"
          python3 scripts/prepare-xberg-adapted.py --archive "$archive"
          cargo fetch --locked --manifest-path target/xberg-adapted/workspace/Cargo.toml --target "$host_target"
          bash scripts/build-document-helpers.sh --offline --jobs 1 --target-root "$GITHUB_WORKSPACE/target/document-helpers"
          mkdir -p target/debug
          cp target/document-helpers/artifacts/brn-xberg-helper* target/debug/
          echo "BRN_XBERG_HELPER=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper" >> "$GITHUB_ENV"
          echo "BRN_XBERG_HELPER_BRN=$GITHUB_WORKSPACE/target/document-helpers/artifacts/brn-xberg-helper-brn" >> "$GITHUB_ENV"
      - name: Test native retrieval without model assets
        run: cargo test -p brn-retrieval --features native --lib --test model_download --locked --offline
      - name: Test current canonical search with the native retrieval feature
        run: cargo test -p brn-threads-app --features native-retrieval --locked --offline
      - name: Build the native retrieval CLI
        run: cargo build -p brn --features native-retrieval --locked --offline
      - name: Build the combined native desktop
        run: cargo build -p brn-desktop --features native-ui,native-retrieval --locked --offline
      - name: Lint the combined native desktop
        run: cargo clippy -p brn-desktop --features native-ui,native-retrieval --all-targets --locked --offline -- -D warnings
      - name: Test the combined native desktop state
        run: cargo test -p brn-desktop --features native-ui,native-retrieval --locked --offline
