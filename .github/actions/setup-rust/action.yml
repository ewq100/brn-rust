name: Set up BRN Rust
description: Install the pinned toolchain, optional native build dependencies, and a scoped Rust cache.
inputs:
  lane:
    description: Feature lane included in the cache key.
    required: true
  native:
    description: Install native UI and retrieval build dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install the repository toolchain
      shell: bash
      run: |
        # Rustup reads rust-toolchain.toml and installs its toolchain/components.
        rustup show
        rustc --version --verbose
        cargo --version
    - name: Install Linux native build dependencies
      if: inputs.native == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential clang cmake libclang-dev lld pkg-config protobuf-compiler \
          libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libva-dev \
          libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
    - name: Install macOS native build dependencies
      if: inputs.native == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v protoc >/dev/null 2>&1; then
          brew install protobuf
        fi
        protoc --version
    - name: Install Windows native build dependencies
      if: inputs.native == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
          choco install protoc --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        protoc --version
    - name: Restore Rust dependencies and build cache
      if: runner.os != 'macOS'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Include build profiles: the virtual workspace root is otherwise omitted.
        # Keep rust-cache compiler/host/toolchain/lockfile keys as well.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.lane }}-${{ hashFiles('Cargo.toml') }}
        cache-bin: 'false'
        cache-on-failure: 'true'
        # PRs restore base/main caches without uploading large ref-only copies.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Restore Rust and isolated helper dependency caches on macOS
      if: runner.os == 'macOS'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Include build profiles; preserve compiler, host, toolchain and lockfile dimensions.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.lane }}-${{ hashFiles('Cargo.toml', 'tools/xberg-intake-helper/adapted.Cargo.lock', 'tools/xberg-intake-helper/Cargo.toml', 'tools/xberg-intake-helper/build.rs', 'tools/xberg-intake-helper/build-identity.txt', 'scripts/build-document-helpers.sh', 'scripts/prepare-xberg-adapted.py', 'patches/xberg/1.3.10/0001-docx-table-grid-spans.patch', 'patches/xberg/1.3.10/source-manifest.json', 'patches/xberg/1.3.10/0003-docx-namespaces.patch', 'patches/xberg/1.3.10/0003-source-manifest.json', 'patches/xberg/1.3.10/0004-pptx-order-hidden.patch', 'patches/xberg/1.3.10/0004-source-manifest.json', 'patches/xberg/1.3.10/0005-docx-comment-references.patch', 'patches/xberg/1.3.10/0005-source-manifest.json') }}
        workspaces: |
          . -> target
          tools/xberg-intake-helper -> ../../.brn-ci-document-helpers/stock
          tools/xberg-intake-helper -> ../../.brn-ci-document-helpers/adapted
        cache-bin: 'false'
        cache-on-failure: 'true'
        # PRs restore base/main caches without uploading large ref-only copies.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Discard restored generated Xberg workspace
      shell: bash
      run: |
        # This derived workspace contains checkout-specific paths; regenerate it.
        test ! -L target
        rm -rf -- target/xberg-adapted
    - name: Fetch locked dependencies for this runner
      shell: bash
      run: |
        host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
        cargo fetch --locked --target "$host_target"
    - name: Create an explicit safe Unix fixture parent
      if: runner.os != 'Windows'
      shell: bash
      run: |
        fixture_parent="$(mktemp -d "$RUNNER_TEMP/brn-ci-tests.XXXXXX")"
        # macOS system temp paths can contain symlinks that Auth correctly refuses.
        fixture_parent="$(cd "$fixture_parent" && pwd -P)"
        printf 'TMPDIR=%s\n' "$fixture_parent" >> "$GITHUB_ENV"
